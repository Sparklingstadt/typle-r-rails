# The guide's own texts, where typle-r's guide (typle.guide.*) describes something this app does differently.
ja:
  design:
    guide:
      practice:
        flow:
          p6: "上部の「思い出して打つ」を入れると、答えを隠して練習します。補足はそのまま表示し、答えは未入力の文字数だけ「＿」で示します。次の単語・すべての単語は表示しません。「答えを見る」（<keys>Shift+Enter</keys>）で答えを表示でき、その単語は間違えた単語に数えます。この練習の記録は「思い出す」として、通常の記録とは分けて比べます。練習の途中では切り替えられません。"
        writing:
          p2: "表示された単語を見ながら、OS の手書き入力（Windows の手書きパネル、Android タブレットの手書きキーボード、IME の手書きなど）で入力欄に書きます。韓国語のリストは、アプリの手書きパッドにも書けます。"
      records:
        home:
          text: "記録が1件以上あると、<home>ホーム</home>に今週の練習回数・連続練習日数・平均正確率・練習時間、次に練習するとよいリスト、リストごとの1単語あたりの秒数と正確率の推移を表示します。週は月曜はじまりです。"
      storage:
        browser:
          p2: "サーバーに保存し、Cookie でこのブラウザーと結びつけます。別の端末やブラウザーとは同期しません。"
        warning:
          p1: "このブラウザーの Cookie を削除すると、このブラウザーに保存したデータは開けなくなります。大切なリストは「CSVエクスポート」で書き出しておけます。"
