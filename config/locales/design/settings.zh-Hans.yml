        description: 练习时输入文字的相关设置。
        simpleSpecial:
          heading: 特殊字符简易输入
          description: 对于捷克语、西班牙语等中带有重音符、波浪符等符号的字母（如 í、ó、ñ、č），可以直接输入不带符号的字母（i、o、n、c）。直接输入带符号的字母同样算正确。 俄语西里尔字母也支持拉丁字母输入，例如 привет → privet、школа → shkola、я → ya。直接输入西里尔字母同样算正确。
          label: 使用特殊字符简易输入
          hint: 开启后，可以输入 á → a、č → c、ш → sh、я → ya。
        ignoreCase:
          heading: 不区分大小写
          description: 将 A 和 a 这样的大写和小写字母视为同一个字母。无论是否按 Shift 键输入都算正确。
