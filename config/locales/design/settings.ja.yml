      input:
        title: 入力
        description: 練習で文字を入力するときの設定です。
        simpleSpecial:
          heading: 特殊文字の簡易入力
          description: チェコ語やスペイン語などの í・ó・ñ・č のように、アクセントやティルダなどの記号が付いた文字を、記号のない文字（i・o・n・c）で入力できるようにします。記号付きの文字をそのまま入力しても正解になります。 ロシア語のキリル文字も、привет → privet、школа → shkola、я → ya のようにラテン文字で入力できます。キリル文字の直接入力も正解になります。
          label: 特殊文字の簡易入力を使う
          hint: ONにすると、á → a、č → c、ш → sh、я → ya のように入力できます。
        ignoreCase:
          heading: 大文字・小文字を区別しない
          description: A と a のように、大文字と小文字を同じ文字として扱います。Shift キーを押さずに入力しても、押して入力しても正解になります。
          label: 大文字・小文字を区別しない
          hint: ONにすると、A や É などの大文字を a や é と入力しても正解になります（逆も同じです）。
        simpleTable:
          heading: 簡易入力の対応表
          description: 特殊文字の簡易入力をONにしたときに、それぞれの文字の代わりに入力できるキーです。
