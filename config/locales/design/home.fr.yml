          title: Apprenez les mots que vous voulez en les tapant.
          lead: Typle est une application de dactylographie pour s’entraîner avec vos propres listes de mots ou des packs officiels. Retenez des commandes et la syntaxe de programmation, ou des mots d’une autre langue, en les tapant.
