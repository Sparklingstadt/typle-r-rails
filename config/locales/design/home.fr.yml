              one: "%{count} liste"
              other: "%{count} listes"
            text: Mots et phrases en chinois (HSK niveaux 5 et 6), coréen, anglais, français, allemand, espagnol, russe et tchèque. Le chinois et le coréen peuvent aussi se pratiquer à l’écriture manuscrite.
        features:
          title: Ce que vous pouvez faire
          own:
            title: S’entraîner avec vos propres listes
