      input:
        title: Ввод
        description: Настройки ввода текста во время тренировки.
        simpleSpecial:
          heading: Упрощённый ввод специальных символов
          description: 'Позволяет вводить буквы с ударением, тильдой и другими знаками — например, í, ó, ñ и č в чешском или испанском — обычной буквой (i, o, n, c). Буква со знаком тоже засчитывается. Русские буквы также можно вводить латиницей: например, привет → privet, школа → shkola и я → ya. Прямой ввод кириллицей тоже засчитывается.'
          label: Использовать упрощённый ввод специальных символов
          hint: Если включено, можно вводить á → a, č → c, ш → sh и я → ya.
        ignoreCase:
          heading: Не различать заглавные и строчные
          description: Заглавные и строчные буквы, например A и a, считаются одной буквой. Ввод с Shift и без него засчитывается.
          label: Не различать заглавные и строчные
          hint: Если включено, заглавные буквы вроде A и É засчитываются при вводе a и é (и наоборот).
        simpleTable:
          heading: Таблица упрощённого ввода
