# The guide's own texts, where typle-r's guide (typle.guide.*) describes something this app does differently.
zh-Hant:
  design:
    guide:
      practice:
        flow:
          p6: "開啟上方的「憑記憶輸入」後，會隱藏答案進行練習。備註照常顯示，答案依未輸入的字元數顯示為「＿」。不顯示下一個單字與所有單字。點選「查看答案」（<keys>Shift+Enter</keys>）即可顯示答案，該單字計為出錯的單字。這種練習的紀錄標為「回憶」，與一般紀錄分開比較。練習途中無法切換。"
        choose:
          p1: "點選上方的「包 › 清單」，可以切換要練習的清單，其中的清單依包分組。也可以從右側（手機上為下方）的清單中選擇，可依包名、清單名稱、難度、分類或標籤搜尋。有多份清單的包，展開後依難度或名稱選擇清單。"
        writing:
          p2: "看著顯示的單字，用系統的手寫輸入（Windows 手寫面板、Android 平板的手寫鍵盤、輸入法的手寫等）寫進輸入框。韓語清單也可以寫在應用程式的手寫板上。"
          p4: "Handwriting 的記錄與一般記錄、回憶記錄分開比較，在最佳記錄頁面切換「一般／回憶／Handwriting」查看。首頁的本週次數、練習時間與連續天數會計入，但正確率、趨勢與下一個練習的清單只比較打字記錄。Handwriting 不能與「憑記憶輸入」同時使用。"
      records:
        home:
          text: "有 1 筆以上的紀錄後，<home>首頁</home>會顯示本週的練習次數、連續練習天數、平均正確率與練習時間、接下來適合練習的清單，以及各清單每個單字所需秒數與正確率的變化。每週從星期一開始。"
      storage:
        browser:
          p2: "資料儲存在伺服器上，透過 Cookie 與此瀏覽器連結，不會與其他裝置或瀏覽器同步。"
        warning:
          p1: "刪除此瀏覽器的 Cookie 後，儲存在此瀏覽器的資料將無法再開啟。重要的清單可以透過「匯出 CSV」先備份起來。"
