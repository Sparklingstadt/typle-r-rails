# The guide's own texts, where typle-r's guide (typle.guide.*) describes something this app does differently.
ru:
  design:
    guide:
      practice:
        flow:
          p6: "Включите вверху «Набор по памяти», чтобы тренироваться со скрытым ответом. Примечание показывается, а ответ отображается знаками «＿» — по одному на каждый ещё не набранный символ. Следующие слова и полный список слов не показываются. Кнопка «Показать ответ» (<keys>Shift+Enter</keys>) открывает его, а слово засчитывается как ошибочное. Такие результаты сохраняются как «По памяти» и сравниваются отдельно от обычных. Во время тренировки режим не переключается."
        writing:
          p2: "Смотрите на показанное слово и пишите его в поле средствами рукописного ввода вашей системы (панель рукописного ввода Windows, рукописная клавиатура Android-планшета, рукописный режим IME и т. д.). Корейские списки можно писать и на панели рукописного ввода приложения."
      records:
        home:
          text: "Когда появится хотя бы один результат, на странице <home>Главная</home> будут показаны число тренировок за неделю, серия дней подряд, средняя точность и время тренировок, список, который стоит потренировать следующим, а также изменение секунд на слово и точности по каждому списку. Неделя начинается с понедельника."
      storage:
        browser:
          p2: "Данные сохраняются на сервере и привязаны к этому браузеру через cookie; они не синхронизируются с другими устройствами и браузерами."
        warning:
          p1: "Если удалить cookie этого браузера, данные, сохранённые в этом браузере, станут недоступны. Важные списки можно заранее выгрузить через «Экспорт CSV»."
