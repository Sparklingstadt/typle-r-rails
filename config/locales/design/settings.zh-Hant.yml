        title: 輸入
        description: 練習時輸入文字的相關設定。
        simpleSpecial:
          heading: 特殊字元簡易輸入
          description: 對於捷克語、西班牙語等中帶有重音符、波浪符等符號的字母（如 í、ó、ñ、č），可以直接輸入不帶符號的字母（i、o、n、c）。直接輸入帶符號的字母同樣算正確。 俄語西里爾字母也支援拉丁字母輸入，例如 привет → privet、школа → shkola、я → ya。直接輸入西里爾字母同樣算正確。
          label: 使用特殊字元簡易輸入
          hint: 開啟後，可以輸入 á → a、č → c、ш → sh、я → ya。
        ignoreCase:
          heading: 不區分大小寫
          description: 將 A 和 a 這樣的大寫和小寫字母視為同一個字母。無論是否按 Shift 鍵輸入都算正確。
          label: 不區分大小寫
          hint: 開啟後，A、É 等大寫字母輸入 a、é 也算正確（反之亦然）。
