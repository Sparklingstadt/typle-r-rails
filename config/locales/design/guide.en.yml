# The guide's own texts, where typle-r's guide (typle.guide.*) describes something this app does differently.
en:
  design:
    guide:
      practice:
        flow:
          p6: "Turn on “Type from memory” at the top to practice with the answer hidden. The note is shown, and the answer appears as one “＿” per character still to type. The next words and the full word list are not shown. “Show answer” (<keys>Shift+Enter</keys>) reveals it, and the word counts as missed. These runs are saved as “Recall” and compared separately from normal runs. It cannot be switched during a run."
        writing:
          p2: "Look at the word shown and write it in the field with your OS’s handwriting input (the Windows handwriting panel, the handwriting keyboard of an Android tablet, an IME’s handwriting, and so on). Korean lists can also be written on the app’s handwriting pad."
      records:
        home:
          text: "Once you have at least one record, <home>Home</home> shows this week’s practice count, your practice streak, average accuracy, and practice time, which list to practice next, and how seconds per word and accuracy have changed for each list. Weeks start on Monday."
      storage:
        browser:
          p2: "Data is saved on the server, tied to this browser by a cookie, and is not synced with other devices or browsers."
        warning:
          p1: "If you clear this browser’s cookies, the data saved in this browser can no longer be opened. You can back up important lists with “Export CSV”."
