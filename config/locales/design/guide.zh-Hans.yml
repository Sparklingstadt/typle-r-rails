# The guide's own texts, where typle-r's guide (typle.guide.*) describes something this app does differently.
zh-Hans:
  design:
    guide:
      practice:
        flow:
          p6: "打开顶部的“凭记忆输入”后，会隐藏答案进行练习。备注照常显示，答案按未输入的字符数显示为“＿”。不显示下一个单词和全部单词。点击“查看答案”（<keys>Shift+Enter</keys>）可以显示答案，该单词计为出错的单词。这种练习的记录标为“回忆”，与普通记录分开比较。练习途中无法切换。"
        choose:
          p1: "点击顶部的“包 › 列表”，可以切换要练习的列表，其中的列表按包分组。也可以从右侧（手机上为下方）的列表中选择，可按包名、列表名、难度、分类或标签搜索。有多个列表的包，展开后按难度或名称选择列表。"
        writing:
          p2: "看着显示的单词，用系统的手写输入（Windows 手写面板、Android 平板的手写键盘、输入法的手写等）写进输入框。韩语列表也可以写在应用的手写板上。"
          p4: "Handwriting 的记录与普通记录、回忆记录分开比较，在最佳记录页面切换“普通／回忆／Handwriting”查看。首页的本周次数、练习时间和连续天数会计入，但正确率、趋势和下一个练习的列表只比较打字记录。Handwriting 不能与“凭记忆输入”同时使用。"
      records:
        home:
          text: "有 1 条以上记录后，<home>首页</home>会显示本周的练习次数、连续练习天数、平均正确率和练习时间，接下来适合练习的列表，以及各列表每个单词所需秒数和正确率的变化。每周从星期一开始。"
      storage:
        browser:
          p2: "数据保存在服务器上，通过 Cookie 与此浏览器关联，不会与其他设备或浏览器同步。"
        warning:
          p1: "清除此浏览器的 Cookie 后，保存在此浏览器中的数据将无法再打开。重要的列表可以通过“导出 CSV”进行备份。"
