      input:
        title: Input
        description: Settings for how you type during practice.
        simpleSpecial:
          heading: Simple special-character input
          description: Lets you type letters with accents, tildes and other marks — like í, ó, ñ and č in Czech or Spanish — with the plain letter (i, o, n, c). Typing the marked letter itself is still correct. Russian Cyrillic letters also accept Latin input, for example привет → privet, школа → shkola and я → ya. Direct Cyrillic input is still correct.
          label: Use simple special-character input
          hint: When on, you can type á → a, č → c, ш → sh and я → ya.
        ignoreCase:
          heading: Ignore upper and lower case
          description: Treats upper and lower case, such as A and a, as the same letter. Typing with or without Shift is correct either way.
          label: Ignore upper and lower case
          hint: When on, capitals such as A and É count as correct when you type a and é (and the other way round).
        simpleTable:
          heading: Simple input reference
          description: The keys you can type instead of each letter when simple special-character input is on.
