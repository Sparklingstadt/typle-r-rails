      guide: 使用说明
      about: 关于 Typle
    about:
      title: 关于 Typle
      lead: Typle 是一款通过打字来记忆命令和外语单词的单词本。它是将用 Next.js 开发的 typle-r 用 Ruby on Rails %{version} 重写的版本。
      storage: 数据保存位置
      browser: 此浏览器
      account: 账号
      where: 保存位置
      browser_where: 与此浏览器关联的服务器数据（通过 Cookie 识别）
      account_where: 账号数据
      sync: 其他设备
      browser_sync: 不同步
      account_sync: 登录后数据相同
      lost: 何时丢失
      browser_lost: 清除浏览器 Cookie 时
      account_lost: 删除账号时
      now: 当前保存位置：%{storage}
      tech: 使用的技术
      licenses: 许可证
      licenses_text: 手写板使用了以下软件和模型。
    guide:
      title: 使用说明
      step1: 练习
      step2: 创建单词列表
      step3: 查看最佳记录
      toc: 目录
      practice:
        heading: 练习
        body:
          - 在“开始练习”中选择列表，在输入框中输入显示的单词。按下第一个键开始计时，输入最后一个字符时停止。离开输入框会暂停。
          - “回想”模式会隐藏单词，只看注释来输入。想不起来时可以用“查看答案”（Shift+Enter）显示。
          - 设置了手写语言的列表可以选择“Handwriting”。看着范本，用操作系统的手写输入抄写。韩语列表还可以在应用的手写板上书写。
      lists:
        heading: 创建单词列表
        body:
          - 用“创建词包”建立词包，再添加列表。每行一个单词，用制表符或逗号分隔“显示、输入、注释”。
          - 关注官方词包后，它会加入你的词包。内容保持官方版本，无法编辑。
      results:
        heading: 查看结果和记录
        body:
          - 练习结束后，结果页会显示用时、正确率和打错的单词。最佳记录只比较当前单词数下的记录，先比正确率，再比用时。
          - 在首页可以继续上次的练习，查看薄弱单词和本周总结。
      devices:
        heading: 登记设备
        body:
          - 在“设备”中登记所用键盘，并在练习页面选择，记录中就会保留设备信息。
      storage:
        heading: 保存位置与数据
        body:
          - 未登录时，数据保存在此浏览器中。登录后保存到账号，退出登录后切回浏览器的数据。两份数据不会自动复制。
      keys:
        heading: 键盘操作
        body:
          - Esc：从头开始 / Shift+Enter：查看答案（回想）/ Enter：判定（Handwriting）/ ⌘Z・Ctrl+Z：撤销一笔（手写板）
