      guide: 使い方
      about: Typleについて
    about:
      title: Typleについて
      lead: Typle は、コマンドや外国語の単語をタイピングで覚える単語帳です。Next.js で作られた typle-r を Ruby on Rails %{version} で作り直した版です。
      storage: データの保存先
      browser: このブラウザー
      account: アカウント
      where: 保存先
      browser_where: このブラウザーに結び付いたサーバーのデータ（Cookie で識別）
      account_where: アカウントのデータ
      sync: 別の端末
      browser_sync: 同期されません
      account_sync: ログインすれば同じデータ
      lost: 失われるとき
      browser_lost: ブラウザーの Cookie を消したとき
      account_lost: アカウントを消したとき
      now: 今の保存先：%{storage}
      tech: 使っている技術
      licenses: ライセンス
      licenses_text: 手書きパッドは次のソフトウェアとモデルを使っています。
    guide:
      title: 使い方
      step1: 練習する
      step2: 単語リストを作る
      step3: ベスト記録を見る
      toc: 目次
      practice:
        heading: 練習する
        body:
          - 「練習する」でリストを選び、表示された単語を入力欄に打ちます。最初のキーで時間が動き出し、最後の文字で止まります。入力欄から離れると一時停止します。
          - 「思い出して打つ」では単語を隠し、注釈だけを見て打ちます。分からないときは「答えを見る」（Shift+Enter）で表示できます。
          - 手書きの言語が付いたリストでは「Handwriting」を選べます。見本を見ながら、OS の手書き入力で書き写します。韓国語のリストではアプリの手書きパッドにも書けます。
      lists:
        heading: 単語リストを作る
        body:
          - 「パックを作成」でパックを作り、リストを足します。1行に1語、「表示・入力・注釈」をタブかカンマで区切ります。
          - 公式パックはフォローすると自分のパックに加わります。内容は公式のままで、編集はできません。
      results:
        heading: 結果と記録を見る
        body:
          - 練習を終えると結果画面に時間・正確率・間違えた単語が出ます。ベストは今の語数の記録を、正確率 → 時間の順に比べます。
          - ホームでは続きから、苦手な単語、今週のまとめを確かめられます。
      devices:
        heading: 端末を登録する
        body:
          - 「端末」で使うキーボードを登録し、練習画面で選ぶと、記録に端末が残ります。
      storage:
        heading: 保存先とデータ
        body:
          - ログインしていないとき、データはこのブラウザーに保存されます。ログインするとアカウントに保存し、ログアウトするとブラウザーのデータに戻ります。2つのデータは自動ではコピーしません。
      keys:
        heading: キーボード操作
        body:
          - Esc：最初からやり直す / Shift+Enter：答えを見る（思い出して打つ）/ Enter：判定（Handwriting）/ ⌘Z・Ctrl+Z：1画戻す（手書きパッド）
