      packListsRequired: 請至少選擇一份要放入包的單字清單。
      packDeleted: 此包已被刪除。
      packFollowed: 官方包無法編輯。複製後即可作為自己的包進行編輯。
      levelsConflict: 同一個包中已有難度（沒有難度的清單為名稱）相同的清單。
      tooManyLevels: 一個清單只能有一個難度。
      packFileUnreadable: 無法將此檔案作為單字包讀取。
      invalidPackFile: 此檔案中有超出可儲存上限的項目。
      sharedPackNotFound: 此分享已結束。
      invalidPage: 頁碼無效。
      importInputTypeInvalid: 第 %{line} 行的 input_type 必須是 command、code 或 word。
      invalidRequest: 請求內容無效。
      loginIdFormat: ID 請使用3到32個半形英文字母、數字、「_」或「-」。
      passwordLength: 密碼請使用10到128個字元。
      passwordSameAsId: 密碼不能與 ID 相同。
      emailFormat: 電子郵件地址的格式不正確。
      loginIdTaken: 此 ID 已被使用，請換一個。
      tooManyRequests: 請求次數過多，請稍後再試。
      invalidToken: 此連結無法使用，可能已過期或已被使用。
      notPasswordAccount: 僅適用於使用 ID 和密碼登入的帳號。
      wrongPassword: 目前的密碼不正確。
    format:
      today: 今天
      yesterday: 昨天
      dateWithWeekday: "%{date}（%{weekday}）"
      units:
        hours: 小時
        minutes: 分
        seconds: 秒
      time:
        one: "%{value}%{unit}"
        two: "%{first}%{firstUnit}%{second}%{secondUnit}"
      defaultDevice: 預設
      noDevice: 未記錄
      noDeviceRecorded: 未記錄裝置
      deviceWithLayout: "%{name}（%{layout}）"
    globalError:
      title: 無法顯示頁面
      description: 請稍後再試一次。
      reload: 重新載入
    guide:
      meta:
        title: 使用說明 | Typle
        description: 說明 Typle 的練習入門、單字清單的建立方式、紀錄的查看方式、資料的儲存位置及鍵盤操作。
      title: 使用說明
      intro: 從如何開始練習，到單字清單的建立、紀錄的查看與資料的儲存位置，都整理在這裡。不必登入也能使用所有功能。
      contentsLabel: 本頁內容
      contents:
        practice: 開始練習
        lists: 建立單字清單
        records: 查看結果與紀錄
        devices: 登錄裝置
        storage: 儲存位置與資料
        shortcuts: 鍵盤操作
      start:
        title: 三步驟開始
        follow:
          title: 追蹤官方包
          text: 追蹤 Go、Kotlin 等官方包後，它們會出現在你的包列表中，可以馬上開始練習。
          action: 官方包
        create:
          title: 建立自己的包
          text: 選擇現有的單字清單，整理成包。單字清單可以單獨建立，也可以從 CSV 檔案匯入。
          action: 建立包
        review:
          title: 回顧紀錄
          text: 打完最後一個單字後，紀錄會自動儲存，可以查看個人最佳與用時的變化。
          action: 最佳紀錄
      legend:
        typed: 輸入：<mono>%{typed}</mono>
        swatch: 字
        done:
          label: 已輸入
          note: "（綠色）"
        current:
          label: 下一個要輸入的字元
          note: "（底線）"
        pending:
          label: 尚未輸入的字元
          note: "（白色，淺色主題下為黑色）"
        error:
          label: 打錯的字元
          note: "（紅色）"
      practice:
        lead: 在<play>開始練習</play>選擇單字清單，然後輸入顯示的單字。
        colors:
          title: 輸入的顏色
          text: 打對的字元會變成綠色，並進到下一個字元。打錯字元時，要輸入的字元會變成紅色，在打出正確字元之前不會前進。沒有輸入欄：單字中的底線表示目前的輸入位置。顯示的單字與要輸入的字元不同時（例如輸入「taipei」來打出「臺北」），要輸入的字元會顯示在單字下方，並由它來標示顏色。
        flow:
          title: 練習流程
          p1: 所有字元都一致後會進入下一個單字，完成最後一個單字即結束練習。
          p2: 從第一次輸入到完成全程計時，練習中會顯示經過時間、速度（每分鐘正確輸入的字元數）、正確率與錯誤數。
          p3: 以輸入法輸入的中文、日文等，以選字確定後的文字判定，組字中的文字不判定。無法使用貼上與拖放輸入。
          p4: 進度列下方會顯示接下來的 3 個單字，點選「顯示所有單字」可查看整份清單。
          p5: 點選上方的眼睛按鈕，即可顯示或隱藏練習中的數據（經過時間、速度、正確率與錯誤數）。所選狀態會儲存在此瀏覽器中。隱藏後計時與紀錄儲存不受影響，結果畫面仍會顯示數值。
          p6: 開啟上方的「憑記憶輸入」後，會隱藏答案進行練習。備註中的答案部分會被遮住，答案依未輸入的字元數顯示為「＿」。不顯示下一個單字、所有單字與要輸入的字元提示。點選「查看答案」即可顯示答案，剩餘的字元計為錯誤。這種練習的紀錄標為「回憶」，與一般紀錄分開比較。所選狀態會儲存在此瀏覽器中，練習途中無法切換。
        choose:
          title: 選擇包、清單與裝置
          p1: 點選上方的「包 › 清單」，先選擇包，再切換要練習的清單。包依最近練習的順序排列，可依包名、分類、標籤、清單名稱或單字搜尋。只有一份清單的包，選擇後會直接選定該清單。有多份清單的包中，具難度的清單以難度按鈕選擇，沒有難度的清單以名稱按鈕選擇。也可以從右側（手機上為下方）的清單中選擇。
          p2: 練習途中選擇其他清單時，會先確認是否中斷。未完成的練習不會留下紀錄。
          p3: 點選「重來」或按 <keys>Esc</keys>，即可從頭重新練習同一份清單。
          p4: 請在輸入第一個字元之前，透過上方的「裝置」選擇練習用的裝置（<devicesSection>登錄裝置</devicesSection>）。
        writing:
          title: Typle Handwriting（手寫）
          p1: 在單字清單的編輯頁面開啟「用於手寫練習（Typle Handwriting）」並選擇語言，就可以手寫練習這個清單。在練習頁面選擇該清單時，會出現「打字／Handwriting」切換。
          p2: 看著顯示的單字，用系統的手寫輸入（Windows 手寫面板、Android 平板的手寫鍵盤、輸入法的手寫等）寫進輸入框。網頁版沒有繪圖畫布。
          p3: 輸入與單字一致就進入下一個。不一致時按「判定」（<keys>Enter</keys>）會記一次失誤，「跳過」也記一次失誤並進入下一個。正在轉換的文字不會判定。
          p4: Handwriting 的記錄與一般記錄、回憶記錄分開比較，在最佳記錄頁面切換「一般／回憶／Handwriting」查看。首頁的本週次數、練習時間與連續天數會計入，但正確率、趨勢與下一個練習的清單只比較打字記錄。Handwriting 不能與「憑記憶輸入」同時使用。練習途中切換時會先確認。智慧型手機將在今後支援。
      lists:
        lead: 在<create>建立包</create>建立新的包，在<edit>單字包</edit>編輯已儲存的包與清單。
        packs:
          title: 包與清單
          p1: 單字清單會以「包」整理管理。單字清單可以單獨建立；建立包時，需要輸入包的名稱並選擇要放入的單字清單。
          p2: 透過包的「…」選單中的「新增清單」，可以在已儲存的包中新增清單。
          p3: 透過包的「…」選單中的「編輯包」，可以變更名稱、說明、類別與標籤，也可以調整其中清單的順序。
          p4: 在清單的編輯畫面中，可以重新選擇所屬的包（也就是移到其他包）。還可以填寫一個難度。
        files:
          title: 包的複製、檔案與官方包
          p1: 透過包的「…」選單中的「複製」，可以連同清單一起複製包。名稱會是「名稱（副本）」，並放在原包的後面。不會複製練習紀錄。
          p2: 透過包的「…」選單中的「匯出」，可以將包儲存成「包名稱.typle-pack.json」檔案。檔案包含名稱、說明、類別、標籤、清單與單字，不含練習紀錄。
          p3: 用「從檔案匯入」選擇該檔案，就能匯入成新的包（在還沒有任何包時也能使用）。檔案上限為 1 MiB，無法讀取的檔案不能匯入。已有同名的包時，名稱會變成「名稱（2）」。
          p4: 在單字包的「官方包」中按「追蹤」，該包就會加入你的包列表。追蹤中的包會顯示「官方」，並隨官方版本自動更新。追蹤中的包無法編輯；想修改時，請用「複製」把它變成自己的包。「取消追蹤」會把該包連同練習紀錄一起從列表中移除。
        interests:
          title: 興趣
          p1: 在<interests>興趣</interests>中選擇「語言」「程式設計」標籤。可以選多個，按下即儲存。一開始所有標籤都已選取，所有官方包都符合興趣。
          p2: 選擇上層標籤後，下方會展開「中文」「俄語」「韓語」或「Go」「Kotlin」等標籤。取消上層標籤時，下方的選擇也會一併取消。
          p3: 選擇興趣後，單字包中的「官方包」會分為「符合興趣的詞包」和「其他詞包」。若上層標籤下沒有選擇任何標籤，該領域的所有詞包都算符合；若有選擇，則帶有這些標籤的詞包算符合。興趣頁面的標籤下方也會列出符合的官方包，顯示包名、包含的單字列表、單字數和開關。開啟開關並按下底部的「新增」即可追蹤；關閉追蹤中包的開關並按下「新增」即可取消追蹤（練習紀錄也會刪除）。
          p4: 登入時興趣儲存到帳號，未登入時儲存到此瀏覽器。
        share:
          title: 把包交給別人
          p1: 要把包交給別人，可透過包的「…」選單中的「匯出」儲存成「包名稱.typle-pack.json」檔案，或透過「匯出 CSV」將單一清單儲存成 CSV 檔案，再傳送檔案。不含練習紀錄。
          p2: 對方可以用「從檔案匯入」匯入包檔案，編輯清單時用「匯入 CSV」匯入 CSV 檔案。
        input:
          title: 輸入單字
          p1: 輸入清單名稱，並為每個單字填寫「顯示的單字」與「輸入的文字」。補充說明可不填。
          p2: "「輸入的文字」留空時，會使用與顯示的單字相同的字元。"
          p3: 可以透過拖曳、「…」選單或 <keys>Alt+↑↓</keys> 調整單字順序。按 <keys>Enter</keys> 會移到下一個單字，在最後一個單字上按則新增一列。
          p4: 點選「儲存」或按 <keys>Ctrl+Enter</keys>（Mac 為 <keys>⌘+Enter</keys>）即可儲存。
        cannotSave:
          title: 無法儲存時
          p1: 含有空白列的清單、沒有單字的清單，以及與同一個包中其他清單同名的清單都無法儲存。
          p2: 每份清單最多可放 1,000 個單字，最多可儲存 150 份清單。
          p3: 有尚未儲存的變更時，取消或使用瀏覽器的「上一頁」之前會先確認。
          p4: 變更單字數後，先前的紀錄將不再列入最佳紀錄的排名（紀錄本身會保留。請參閱<wordCount>單字數變更時</wordCount>）。
        manage:
          title: 管理清單
          p1: 在<edit>單字包</edit>中，可以依包名稱、清單名稱或單字搜尋，並變更排列順序。
          p2: 透過包的「…」選單，可以進行練習、編輯包、新增清單與刪除。刪除包時，其中的清單與練習紀錄也會一併刪除。每份清單所在的列也有「…」選單，可以查看最佳紀錄與練習紀錄，也可以進行 CSV 匯出、複製與刪除。追蹤中的官方包無法編輯，以「取消追蹤」取代刪除。
          p3: 複製時只會複製單字，不會複製練習紀錄。複製包時也是如此。
        csv:
          title: CSV 檔案
          p1: 編輯清單時，透過「匯入 CSV」選擇檔案，確認內容後，可以選擇加到目前單字的最後面，或是取代現有單字。
          p2: 第一列為欄位名稱。input（要輸入的字元）與 display（顯示的單字）為必填，annotation（補充說明）可省略。可匯入以 UTF-8 儲存、1 MiB 以內且不超過 1,000 個單字的檔案。
          p3: "「匯出 CSV」會將輸入、顯示與補充說明寫入 UTF-8 的 CSV 檔案（不含練習紀錄）。匯出的檔案可以直接匯入。"
          exampleLabel: CSV 檔案範例
          example: |-
            input,display,annotation
            taipei,臺北,臺灣的首都
            tainan,臺南,
      records:
        lead: 練習完成後，紀錄會自動儲存。
        complete:
          title: 完成畫面
          p1: 顯示用時、正確率與錯誤字元數、速度、打錯的詞數及裝置。下方列出打錯的詞與第一個出錯的字元。點選「只練習打錯的詞」即可只複習這些詞（複習不記錄）。
          p2: 正確率是輸入的字元中正確字元所占的比例。刪除操作不計入，修正後重新輸入的字元會計入。
          p3: 刷新個人最佳時，會顯示徽章以及與先前最佳的差距。
          p4: 點選「再來一次」（<keys>Enter</keys>）即可馬上再練習同一份清單。儲存失敗時，請點選「重新儲存紀錄」。
        history:
          title: 練習紀錄
          p1: "<records>練習紀錄</records>會依日期由新到舊顯示練習歷程，並可依清單或裝置篩選。篩選條件會保留在 URL 中，因此可以透過書籤或連結開啟相同的畫面。"
          p2: 依清單篩選時，會顯示該清單的練習次數與最佳紀錄，並可從「開始練習」馬上練習。選擇包後，清單的選項僅限該包中的清單。包含 2 份以上清單的包，其紀錄會顯示為「包名 › 清單名」。
          p3: 每份清單的最佳紀錄會標上「最佳」。刪除最佳紀錄時，確認畫面會顯示下一筆將成為最佳的紀錄。
        best:
          title: 最佳紀錄
          p1: 在<rankings>最佳紀錄</rankings>選擇清單後，會顯示個人最佳、最近 5 次的平均、用時的變化與排名在前的紀錄。最佳紀錄畫面會依包歸類清單。每個包會顯示練習次數、已練習的清單數（已練習 n/m）、最後練習的時間，以及最近 7 天內刷新最佳的清單數。排序以包為單位，包內的清單依難度順序排列。
          p2: 排名可在「正確率優先」（正確率由高到低，相同時依速度由快到慢）與「速度優先」之間切換，並可依裝置篩選。選擇的清單與條件會保留在 URL 中。
          p3: 練習畫面也會顯示所選清單的前 5 筆紀錄，並醒目標示這次的紀錄。
        wordCount:
          title: 單字數變更時
          p1: 新增或刪除清單中的單字後，只有以目前單字數練習的紀錄才會列入排名。練習畫面與練習紀錄中的最佳紀錄也採用相同標準。
          p2: 單字數不同的紀錄，可以透過最佳紀錄的「包含並顯示」加入排名。若還沒有目前單字數的紀錄，則以單字數不同的紀錄排名。
        home:
          title: 首頁
          text: 有 1 筆以上的紀錄後，<home>首頁</home>會顯示本週的練習次數、連續練習天數、平均正確率與練習時間、接下來適合練習的清單，以及各清單每個單字所需秒數與正確率的變化。日期依裝置的時間劃分，每週從星期一開始。
      devices:
        lead: 在<devices>裝置</devices>登錄練習用的電腦或鍵盤後，紀錄中就會留下是用哪台裝置練習的。
        p1: 在練習畫面的「裝置」中選擇的裝置會記在此瀏覽器中，下次練習時也會沿用。選擇之前會使用「預設」。
        p2: 可以依裝置篩選練習紀錄與最佳紀錄。
        p3: 即使變更裝置名稱，先前的紀錄仍會保留練習當時的名稱。最多可登錄 100 台裝置。
      storage:
        lead: 登入是選用的。資料的儲存位置會依是否登入而不同。
        browser:
          title: 儲存在此瀏覽器
          when: 未登入時
          p1: 可以使用所有功能。
          p2: 資料儲存在此瀏覽器的 LocalStorage 中，不會與其他裝置或瀏覽器同步。
        account:
          title: 儲存至帳號
          when: 登入後（GitHub 或 ID 與密碼）
          p1: 資料儲存在帳號專用的伺服器上，只要登入，在任何裝置上都能使用相同的資料。
          p2: 儲存時需要網路連線。
        warning:
          title: 資料會消失的情況
