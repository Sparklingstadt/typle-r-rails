          resume: Вернуться к вводу после щелчка вне поля ввода
          again: Потренироваться ещё раз
          next: Перейти к следующему слову (на последнем слове — добавить строку)
          move: Переместить слово вверх или вниз
          save: Сохранить (на Mac — ⌘ + Enter)
      cta:
        text: Всё готово? Тогда начнём тренировку.
        action: Начать тренировку
