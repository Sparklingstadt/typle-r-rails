      storage: Все функции тренировки и редактирования доступны без входа в аккаунт. Списки слов, история тренировок и устройства сохраняются в этом браузере. После входа (через GitHub или по ID и паролю) данные будут храниться в другом месте — в вашем аккаунте — и синхронизироваться между устройствами. Данные из браузера автоматически не переносятся.
      storageAccount: Вы вошли в аккаунт, поэтому списки слов, история тренировок и устройства сохраняются в аккаунте и синхронизируются с другими устройствами и браузерами, где выполнен вход в тот же аккаунт. Они хранятся отдельно от данных, сохранённых в этом браузере без входа.
