    guide:
      meta:
        title: Как пользоваться | Typle
        description: Как начать тренировку в Typle, создавать списки слов, смотреть результаты, где хранятся данные и какие есть сочетания клавиш.
      title: Как пользоваться
      intro: 'Здесь собрано всё: как начать тренировку, создавать списки слов, смотреть результаты и где хранятся данные. Все функции доступны без входа в аккаунт.'
      contentsLabel: Содержание страницы
      contents:
        practice: Тренировка
        lists: Создание списков слов
        records: Результаты и история
        devices: Регистрация устройств
        storage: Хранение данных
        shortcuts: Сочетания клавиш
      start:
        title: Первые 3 шага
        follow:
          title: Подпишитесь на официальные наборы
          text: Подпишитесь на официальные наборы, например Go или Kotlin, — они появятся среди ваших наборов, и можно сразу начать тренировку.
          action: Официальные наборы
        create:
          title: Создайте свой набор
          text: Выберите уже созданные списки слов и объедините их в набор. Список слов создаётся отдельно; его также можно импортировать из файла CSV.
          action: Создать набор
        review:
          title: Следите за результатами
          text: 'Когда вы наберёте список до конца, результат сохранится автоматически: вы увидите личный рекорд и то, как меняется время.'
          action: Лучшие результаты
      legend:
        typed: 'Ввод: <mono>%{typed}</mono>'
        swatch: Я
        done:
          label: Набрано
          note: "(зелёный)"
        current:
          label: Следующий символ
          note: "(подчёркнут)"
        pending:
          label: Ещё не набрано
          note: "(белый, в светлой теме чёрный)"
        error:
          label: Неверно набранный символ
          note: "(красный)"
      practice:
        lead: Выберите список слов в разделе <play>Тренироваться</play> и набирайте показанные слова.
        colors:
          title: Цвета ввода
          text: 'Правильно набранные символы становятся зелёными, и вы переходите к следующему. Если вы наберёте неверный символ, символ для ввода станет красным, и дальше вы не продвинетесь, пока не наберёте правильный. Поля ввода нет: подчёркивание в слове показывает, где вы находитесь. Если показанное слово отличается от того, что нужно набрать (например, «ёж» набирается как «еж»), под словом выводятся символы для ввода, и подсвечиваются именно они.'
        flow:
          title: Как проходит тренировка
          p1: Когда все символы совпадут, вы перейдёте к следующему слову; после последнего слова тренировка завершается.
          p2: Время отсчитывается от первого нажатия до завершения. Во время тренировки отображаются прошедшее время, скорость (правильно набранных символов в минуту), точность и число ошибок.
          p3: Текст, набираемый через IME (например, японский), проверяется после подтверждения ввода; символы в процессе преобразования не проверяются. Вставка и перетаскивание текста недоступны.
          p4: Под индикатором прогресса показаны следующие 3 слова, а кнопка «Показать все слова» открывает весь список.
          p5: Кнопка с глазом вверху показывает или скрывает текущие показатели (время, скорость, точность и ошибки). Выбор сохраняется в этом браузере. Если их скрыть, отсчёт времени и сохранение результатов не меняются, а на экране результата цифры по-прежнему показываются.
          p6: Включите вверху «Набор по памяти», чтобы тренироваться со скрытым ответом. Примечание показывается со скрытым ответом, а сам ответ отображается знаками «＿» — по одному на каждый ещё не набранный символ. Следующие слова, полный список слов и подсказка «что вводить» не показываются. Кнопка «Показать ответ» открывает его, а оставшиеся символы засчитываются как ошибки. Такие результаты сохраняются как «По памяти» и сравниваются отдельно от обычных. Выбор сохраняется в этом браузере и не меняется во время тренировки.
        choose:
          title: Выбор набора, списка и устройства
          p1: Нажмите «Набор › Список» вверху, чтобы выбрать набор и переключить список для тренировки. Наборы идут в порядке последней тренировки; их можно искать по названию набора, категории, тегу, названию списка или слову. Набор с одним списком выбирается сразу вместе со списком. В наборе из нескольких списков списки со сложностью выбираются кнопками сложности, а списки без неё — кнопками с названиями. Выбрать можно и в перечне справа (на смартфоне — внизу).
          p2: Если выбрать другой список посреди тренировки, приложение попросит подтвердить её прерывание. Незавершённая тренировка не сохраняется.
          p3: Кнопка «Начать заново» или клавиша <keys>Esc</keys> запускает тот же список с начала.
          p4: Выберите устройство для тренировки в меню «Устройство» вверху до того, как наберёте первый символ (<devicesSection>Регистрация устройств</devicesSection>).
        writing:
          title: Typle Handwriting (рукописный ввод)
          p1: В редакторе списка включите «Использовать для рукописной практики (Typle Handwriting)» и выберите язык — тогда этот список можно тренировать от руки. При выборе такого списка на экране практики появляется переключатель «Набор / Handwriting».
          p2: Смотрите на показанное слово и пишите его в поле средствами рукописного ввода вашей системы (панель рукописного ввода Windows, рукописная клавиатура Android-планшета, рукописный режим IME и т. д.). В веб-версии нет холста для рисования.
          p3: Когда ввод совпадает со словом, вы переходите к следующему. Нажатие «Проверить» (<keys>Enter</keys>) без совпадения засчитывает одну ошибку, а «Пропустить» засчитывает одну ошибку и переходит дальше. Текст, который ещё преобразуется, не проверяется.
          p4: Результаты Handwriting сравниваются отдельно от обычных и «по памяти»; на экране лучших результатов переключайтесь между «Обычный», «По памяти» и «Handwriting». На главной они входят в число занятий за неделю, время практики и серию дней, но точность, динамика и следующие списки сравнивают только набор. Handwriting нельзя совмещать с режимом «Набор по памяти». Переключение посреди практики требует подтверждения. Смартфоны будут поддержаны позже.
      lists:
        lead: Новый набор создаётся в разделе <create>Создать набор</create>, а сохранённые наборы и списки редактируются в разделе <edit>Наборы слов</edit>.
        packs:
          title: Наборы и списки
          p1: Списки слов объединяются в «наборы». Список слов создаётся отдельно, а при создании набора нужно указать его название и выбрать списки слов.
          p2: Пункт «Добавить список» в меню «…» набора добавляет список в сохранённый набор.
          p3: Пункт «Изменить набор» в меню «…» набора позволяет изменить название, описание, категорию и теги, а также порядок списков внутри набора.
          p4: В редакторе списка можно выбрать набор, в котором находится список (так список переносится в другой набор). Там же можно указать одну сложность.
        files:
          title: Копирование наборов, файлы наборов и официальные наборы
          p1: Пункт «Дублировать» в меню «…» набора копирует набор вместе со списками. Копия называется «Название (копия)» и ставится сразу после исходного набора. История тренировок не копируется.
          p2: Пункт «Экспортировать» в меню «…» набора сохраняет набор в файл «название-набора.typle-pack.json». В нём название, описание, категория, теги, списки и слова, но нет истории тренировок.
          p3: Выберите этот файл через «Импортировать из файла», и он станет новым набором (это работает и когда наборов ещё нет). Допускаются файлы до 1 МиБ, нечитаемые файлы не импортируются. Если набор с таким названием уже есть, новый получит название «Название (2)».
          p4: В разделе «Официальные наборы» среди наборов слов кнопка «Подписаться» добавляет набор к вашим. Наборы, на которые вы подписаны, помечены как «Официальный» и обновляются вместе с официальной версией. Такой набор нельзя изменять; чтобы внести изменения, сделайте из него свой набор кнопкой «Дублировать». «Отписаться» убирает набор из ваших вместе с историей тренировок.
        interests:
          title: Интересы
          p1: В разделе <interests>Интересы</interests> выберите чипы «Языки» и «Программирование». Можно выбрать сколько угодно; каждый выбор сохраняется сразу после нажатия. Сначала выбраны все чипы, поэтому подходят все официальные наборы.
          p2: Выбор родительского чипа открывает чипы под ним, например «Китайский», «Русский» и «Корейский» или «Go» и «Kotlin». Снятие выбора с родительского чипа снимает его и с чипов под ним.
          p3: 'Когда интересы выбраны, «Официальные наборы» в разделе наборов слов делятся на «Наборы по вашим интересам» и «Другие наборы». Если под родительским чипом ничего не выбрано, подходят все наборы этой области; если выбрано — наборы с этими тегами. На экране «Интересы» под чипами также показаны подходящие официальные наборы: название, списки слов, число слов и переключатель. Включите наборы и нажмите «Добавить» внизу, чтобы подписаться; выключите набор, на который вы подписаны, и нажмите «Добавить», чтобы отписаться (история тренировок удалится).'
          p4: Интересы сохраняются в аккаунте, если вы вошли, и в этом браузере, если нет.
        share:
          title: Как передать набор другому
          p1: Чтобы передать набор другому человеку, сохраните его в файл «название-набора.typle-pack.json» пунктом «Экспортировать» в меню «…» набора или сохраните один список в CSV-файл через «Экспорт CSV» и отправьте файл. История тренировок не включается.
          p2: Получатель импортирует файл набора через «Импортировать из файла», а CSV-файл — кнопкой «Импорт CSV» во время редактирования списка.
        input:
          title: Ввод слов
          p1: Укажите название списка и для каждого слова — «Отображаемое слово» и «Вводимый текст». Примечание необязательно.
          p2: Если оставить поле «Вводимый текст» пустым, набирать нужно будет само показываемое слово.
          p3: Менять порядок слов можно перетаскиванием, через меню «…» или клавишами <keys>Alt+↑↓</keys>. <keys>Enter</keys> переходит к следующему слову, а на последнем слове добавляет новую строку.
          p4: Сохраните список кнопкой «Сохранить» или клавишами <keys>Ctrl+Enter</keys> (на Mac — <keys>⌘+Enter</keys>).
        cannotSave:
          title: Если список не сохраняется
          p1: Нельзя сохранить список с пустыми строками, список без слов и список с таким же названием, как у другого списка в том же наборе.
          p2: В одном списке может быть до 1 000 слов, а сохранить можно до 150 списков.
          p3: Если есть несохранённые изменения, перед отменой или возвратом назад в браузере приложение попросит подтверждение.
          p4: Если изменить количество слов, прежние результаты перестанут учитываться в рейтинге лучших результатов (сами результаты сохранятся; см. <wordCount>Если изменилось количество слов</wordCount>).
        manage:
          title: Управление списками
          p1: В разделе <edit>Наборы слов</edit> можно искать по названию набора, названию списка или словам и менять порядок сортировки.
          p2: 'Меню «…» набора позволяет начать тренировку, изменить набор, добавить список или удалить набор. При удалении набора удаляются и его списки с историей тренировок. У каждой строки списка есть своё меню «…»: лучшие результаты, история тренировок, экспорт в CSV, копирование и удаление. Официальные наборы, на которые вы подписаны, нельзя изменять, а вместо удаления у них есть «Отписаться».'
          p3: При копировании переносятся только слова, история тренировок не копируется. Так же и при дублировании набора.
        csv:
          title: Файлы CSV
          p1: Во время редактирования списка выберите файл кнопкой «Импорт CSV». Просмотрев содержимое, вы сможете добавить слова в конец текущих или заменить их.
          p2: Первая строка содержит названия столбцов. Столбцы input (что набирать) и display (показываемое слово) обязательны, annotation (примечание) можно не указывать. Импортируются файлы в кодировке UTF-8 размером до 1 МиБ и не более 1 000 слов.
          p3: "«Экспорт CSV» записывает ввод, показываемое слово и примечание в CSV-файл в кодировке UTF-8 (история тренировок не включается). Экспортированный файл можно сразу импортировать обратно."
          exampleLabel: Пример CSV-файла
          example: |-
            input,display,annotation
            еж,ёж,животное
            елка,ёлка,
      records:
        lead: Когда вы завершаете тренировку, результат сохраняется автоматически.
        complete:
          title: Экран завершения
          p1: Показывает время, точность и число ошибочных символов, скорость, число слов с ошибками и устройство. Ниже перечислены слова с ошибками и первый ошибочный символ. «Повторить слова с ошибками» запускает только эти слова; такое повторение не записывается.
          p2: Точность — это доля правильных символов среди набранных. Удаления не учитываются, а символы, набранные заново после исправления, учитываются.
          p3: Если вы побили личный рекорд, появится значок и разница с прежним рекордом.
          p4: Кнопка «Ещё раз» (<keys>Enter</keys>) сразу запускает тот же список. Если сохранить результат не удалось, нажмите «Повторить сохранение».
        history:
          title: История тренировок
          p1: В разделе <records>История тренировок</records> тренировки показаны по датам, начиная с новых, и их можно отфильтровать по списку или устройству. Фильтры сохраняются в URL, поэтому тот же вид можно открыть из закладки или по ссылке.
          p2: При фильтре по списку показываются число тренировок и лучший результат по нему, а кнопка «Тренироваться» сразу запускает тренировку. Если выбрать набор, в списке выбора останутся только списки этого набора. В записях наборов из двух и более списков показывается «набор › список».
          p3: Лучший результат каждого списка отмечен меткой «Лучший». При удалении лучшего результата в окне подтверждения показывается, какой результат станет лучшим следующим.
        best:
          title: Лучшие результаты
          p1: Выберите список в разделе <rankings>Лучшие результаты</rankings>, чтобы увидеть личный рекорд, среднее за последние 5 попыток, изменение времени и лучшие результаты. Экран лучших результатов группирует списки по наборам. Для каждого набора показываются число тренировок, число пройденных списков (тренировано n/m), время последней тренировки и число списков, где за последние 7 дней обновлён лучший результат. Сортировка действует на уровне наборов, а списки внутри набора идут по сложности.
          p2: Рейтинг можно переключать между режимами «Точность важнее» (по убыванию точности, при равенстве — по скорости) и «Скорость важнее», а также фильтровать по устройству. Выбранный список и условия сохраняются в URL.
          p3: На экране тренировки тоже показываются 5 лучших результатов выбранного списка, а текущий результат выделяется.
        wordCount:
          title: Если изменилось количество слов
          p1: После добавления или удаления слов в списке в рейтинге учитываются только результаты с текущим количеством слов. То же правило действует для лучших результатов на экране тренировки и в истории.
          p2: Результаты с другим количеством слов можно добавить в рейтинг переключателем «Включить» в разделе лучших результатов. Если результатов с текущим количеством слов ещё нет, рейтинг строится по результатам с другим количеством слов.
        home:
          title: Главная
          text: Когда появится хотя бы один результат, на странице <home>Главная</home> будут показаны число тренировок за неделю, серия дней подряд, средняя точность и время тренировок, список, который стоит потренировать следующим, а также изменение секунд на слово и точности по каждому списку. Дни отсчитываются по часам устройства, неделя начинается с понедельника.
      devices:
        lead: Зарегистрируйте компьютеры и клавиатуры, на которых вы тренируетесь, в разделе <devices>Устройства</devices> — тогда в результатах будет видно, на каком устройстве проходила тренировка.
        p1: Устройство, выбранное в меню «Устройство» на экране тренировки, запоминается в этом браузере и используется в следующих тренировках. Пока вы ничего не выбрали, используется «По умолчанию».
        p2: Историю тренировок и лучшие результаты можно фильтровать по устройству.
        p3: Если переименовать устройство, в прежних результатах останется название на момент тренировки. Можно зарегистрировать до 100 устройств.
      storage:
        lead: Вход в аккаунт необязателен. От того, вошли ли вы, зависит, где хранятся данные.
        browser:
          title: Сохраняется в этом браузере
          when: Если вы не вошли в аккаунт
          p1: Доступны все функции.
          p2: Данные сохраняются в LocalStorage этого браузера и не синхронизируются с другими устройствами и браузерами.
        account:
          title: Сохраняется в аккаунте
          when: Если вы вошли (через GitHub или по ID и паролю)
          p1: Данные хранятся на сервере, выделенном для вашего аккаунта, поэтому после входа они доступны на любом устройстве.
          p2: Для сохранения нужно подключение к интернету.
        warning:
          title: Когда данные пропадают
          p1: Данные, сохранённые в этом браузере, удаляются вместе с данными сайтов в браузере. Важные списки можно заранее выгрузить через «Экспорт CSV».
          p2: При удалении списка удаляется и его история тренировок.
        notes:
          p1: Данные в двух местах хранения не связаны между собой и не переносятся автоматически при входе.
          p2: Данные из прежней версии (v0.1.x) можно добавить в текущее место хранения кнопкой переноса на странице <home>Главная</home>.
          p3: Если сохранить не удалось из-за одновременных изменений в нескольких окнах, загрузите актуальные данные и повторите действие.
      shortcuts:
        lead: Клавиши, которыми можно пользоваться вместо мыши.
        anyKey: Любая клавиша
        screens:
