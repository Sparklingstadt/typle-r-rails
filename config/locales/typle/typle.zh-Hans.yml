    globalError:
      title: 无法显示页面
      description: 请稍后重试。
      reload: 重新加载
    guide:
      meta:
        title: 使用方法 | Typle
        description: 介绍 Typle 的练习入门、单词列表的创建方法、记录的查看方式、数据的保存位置以及键盘操作。
      title: 使用方法
      intro: 从如何开始练习，到单词列表的创建、记录的查看和数据的保存位置，这里都有说明。无需登录即可使用全部功能。
      contentsLabel: 本页内容
      contents:
        practice: 开始练习
        lists: 创建单词列表
        records: 查看结果和记录
        devices: 登记设备
        storage: 保存位置与数据
        shortcuts: 键盘操作
      start:
        title: 三步上手
        follow:
          title: 关注官方包
          text: 关注 Go、Kotlin 等官方包后，它们会出现在你的包列表中，可以马上开始练习。
          action: 官方包
        create:
          title: 创建自己的包
          text: 选择已有的单词列表，整理成包。单词列表可以单独创建，也可以从 CSV 文件导入。
          action: 创建包
        review:
          title: 回顾记录
          text: 输入到最后一个单词后，记录会自动保存，可以查看个人最佳和用时的变化。
          action: 最佳记录
      legend:
        typed: 输入：<mono>%{typed}</mono>
        swatch: 字
        done:
          label: 已输入
          note: "（绿色）"
        current:
          label: 下一个要输入的字符
          note: "（下划线）"
        pending:
          label: 尚未输入的字符
          note: "（白色，浅色主题下为黑色）"
        error:
          label: 输错的字符
          note: "（红色）"
      practice:
        lead: 在<play>开始练习</play>中选择单词列表，然后输入显示的单词。
        colors:
          title: 输入的颜色
          text: 输对的字符会变成绿色，并进入下一个字符。输错字符时，要输入的字符会变成红色，在输入正确字符之前不会前进。没有输入框：单词中的下划线表示当前输入位置。对于显示的单词和要输入的字符不同的单词（例如输入“beijing”来打出“北京”），要输入的字符会显示在单词下方，并对其标色。
        flow:
          title: 练习流程
          p1: 所有字符都一致后进入下一个单词，完成最后一个单词即结束练习。
          p2: 从第一次输入到完成全程计时，练习中会显示已用时间、速度（每分钟正确输入的字符数）、正确率和错误数。
          p3: 使用输入法（IME）输入的中文、日文等，以上屏后的文字为准进行判定，正在转换中的文字不判定。不能粘贴或拖放输入。
          p4: 进度条下方会显示接下来的 3 个单词，点击“显示全部单词”可查看整个列表。
          p5: 点击顶部的眼睛按钮，可以显示或隐藏练习中的数据（已用时间、速度、正确率和错误数）。所选状态会保存在此浏览器中。隐藏后计时和记录保存不受影响，结果画面仍会显示数值。
          p6: 打开顶部的“凭记忆输入”后，会隐藏答案进行练习。备注中的答案部分会被遮住，答案按未输入的字符数显示为“＿”。不显示下一个单词、全部单词和要输入的字符提示。点击“查看答案”可以显示答案，剩余的字符计为错误。这种练习的记录标为“回忆”，与普通记录分开比较。所选状态会保存在此浏览器中，练习途中无法切换。
        choose:
          title: 选择包、列表和设备
          p1: 点击顶部的“包 › 列表”，先选择包，再切换要练习的列表。包按最近练习的顺序排列，可按包名、分类、标签、列表名或单词搜索。只有一个列表的包，选择后会直接选中该列表。有多个列表的包中，带难度的列表用难度按钮选择，没有难度的列表用名称按钮选择。也可以从右侧（手机上为下方）的列表中选择。
          p2: 练习中途选择其他列表时，会先确认是否中断。未完成的练习不会被记录。
          p3: 点击“重来”或按 <keys>Esc</keys>，可从头重新练习同一个列表。
          p4: 请在输入第一个字符之前，通过顶部的“设备”选择练习所用的设备（<devicesSection>登记设备</devicesSection>）。
        writing:
          title: Typle Handwriting（手写）
          p1: 在单词列表的编辑页面打开“用于手写练习（Typle Handwriting）”并选择语言，就可以手写练习这个列表。在练习页面选择该列表时，会出现“打字／Handwriting”切换。
          p2: 看着显示的单词，用系统的手写输入（Windows 手写面板、Android 平板的手写键盘、输入法的手写等）写进输入框。网页版没有绘图画布。
          p3: 输入与单词一致就进入下一个。不一致时按“判定”（<keys>Enter</keys>）会记一次失误，“跳过”也记一次失误并进入下一个。正在转换的文字不会判定。
          p4: Handwriting 的记录与普通记录、回忆记录分开比较，在最佳记录页面切换“普通／回忆／Handwriting”查看。首页的本周次数、练习时间和连续天数会计入，但正确率、趋势和下一个练习的列表只比较打字记录。Handwriting 不能与“凭记忆输入”同时使用。练习途中切换时会先确认。智能手机将在今后支持。
      lists:
        lead: 在<create>创建包</create>中创建新包，在<edit>单词包</edit>中编辑已保存的包和列表。
        packs:
          title: 包与列表
          p1: 单词列表按“包”整理管理。单词列表可以单独创建；创建包时，需要输入包的名称并选择要放入的单词列表。
          p2: 通过包的“…”菜单中的“添加列表”，可以向已保存的包添加列表。
          p3: 通过包的“…”菜单中的“编辑包”，可以更改名称、说明、类别和标签，也可以调整其中列表的顺序。
          p4: 在列表的编辑界面中，可以重新选择所属的包（即移到其他包）。还可以填写一个难度。
        files:
          title: 包的复制、文件与官方包
          p1: 通过包的“…”菜单中的“复制”，可以连同列表一起复制包。名称为“名称（副本）”，并放在原包的后面。不复制练习记录。
          p2: 通过包的“…”菜单中的“导出”，可以将包保存为“包名称.typle-pack.json”文件。文件包含名称、说明、类别、标签、列表和单词，不含练习记录。
          p3: 用“从文件导入”选择该文件，即可作为新包导入（在还没有任何包时也可使用）。文件最大 1 MiB，无法读取的文件不能导入。已有同名包时，名称会变为“名称（2）”。
          p4: 在单词包的“官方包”中点击“关注”，该包就会加入你的包列表。关注的包会显示“官方”，并随官方版本自动更新。关注的包不能编辑；想修改时，请用“复制”把它变成自己的包。“取消关注”会把该包连同练习记录一起从列表中移除。
        interests:
          title: 兴趣
          p1: 在<interests>兴趣</interests>中选择“语言”“编程”标签。可以选多个，按下即保存。一开始所有标签都已选中，所有官方包都符合兴趣。
          p2: 选择上层标签后，下面会展开“中文”“俄语”“韩语”或“Go”“Kotlin”等标签。取消上层标签时，下面的选择也会一并取消。
          p3: 选择兴趣后，单词包中的“官方包”会分为“符合兴趣的词包”和“其他词包”。若上层标签下没有选择任何标签，则该领域的所有词包都算符合；若有选择，则带有这些标签的词包算符合。兴趣页面的标签下方也会列出符合的官方包，显示包名、包含的单词列表、单词数和开关。打开开关并点击底部的“添加”即可关注；关闭已关注包的开关并点击“添加”即可取消关注（练习记录也会删除）。
          p4: 登录时兴趣保存到账号，未登录时保存到此浏览器。
        share:
          title: 把包交给别人
          p1: 要把包交给别人，可通过包的“…”菜单中的“导出”保存为“包名称.typle-pack.json”文件，或通过“导出 CSV”将单个列表保存为 CSV 文件，然后发送文件。不含练习记录。
          p2: 对方可以用“从文件导入”导入包文件，编辑列表时用“导入 CSV”导入 CSV 文件。
        input:
          title: 输入单词
          p1: 输入列表名称，并为每个单词填写“显示的单词”和“输入的文字”。备注可选填。
          p2: 如果“输入的文字”留空，则使用与显示的单词相同的字符。
          p3: 可以通过拖动、“…”菜单或 <keys>Alt+↑↓</keys> 调整单词顺序。按 <keys>Enter</keys> 移到下一个单词，在最后一个单词上按则新增一行。
          p4: 点击“保存”或按 <keys>Ctrl+Enter</keys>（Mac 上为 <keys>⌘+Enter</keys>）即可保存。
        cannotSave:
          title: 无法保存时
          p1: 含有空行的列表、没有单词的列表以及与同一个包中其他列表同名的列表无法保存。
          p2: 每个列表最多可包含 1,000 个单词，最多可保存 150 个列表。
          p3: 有未保存的更改时，取消或使用浏览器的“返回”之前会先确认。
          p4: 更改单词数后，之前的记录将不再计入最佳记录的排名（记录本身会保留。参见<wordCount>单词数变化时</wordCount>）。
        manage:
          title: 管理列表
          p1: 在<edit>单词包</edit>中，可以按包名称、列表名称或单词搜索，并更改排列顺序。
          p2: 通过包的“…”菜单，可以进行练习、编辑包、添加列表和删除。删除包时，其中的列表和练习记录也会一并删除。每个列表所在的行也有“…”菜单，可以查看最佳记录和练习记录，以及进行 CSV 导出、复制和删除。关注的官方包不能编辑，用“取消关注”代替删除。
          p3: 复制时只复制单词，不复制练习记录。复制包时也是如此。
        csv:
          title: CSV 文件
          p1: 编辑列表时，通过“导入 CSV”选择文件，确认内容后，可以选择追加到当前单词的末尾或替换现有单词。
          p2: 第一行为列名。input（要输入的字符）和 display（显示的单词）为必填，annotation（备注）可省略。可以导入以 UTF-8 保存、不超过 1 MiB 且不超过 1,000 个单词的文件。
          p3: "“导出 CSV”会将输入、显示和备注写入 UTF-8 格式的 CSV 文件（不含练习记录）。导出的文件可以直接重新导入。"
          exampleLabel: CSV 文件示例
          example: |-
            input,display,annotation
            beijing,北京,中国的首都
            shanghai,上海,
      records:
        lead: 完成练习后，记录会自动保存。
        complete:
          title: 完成画面
          p1: 显示用时、正确率和错误字符数、速度、打错的词数以及设备。下方列出打错的词和第一个出错的字符。点击“只练习打错的词”可以只复习这些词（复习不记录）。
          p2: 正确率是输入的字符中正确字符所占的比例。删除操作不计入，修改后重新输入的字符会计入。
          p3: 刷新个人最佳时，会显示徽章以及与之前最佳的差距。
          p4: 点击“再来一次”（<keys>Enter</keys>）可立即再次练习同一个列表。保存失败时，请点击“重新保存记录”。
        history:
          title: 练习记录
          p1: 在<records>练习记录</records>中，练习历史按日期从新到旧显示，并可按列表或设备筛选。筛选条件会保留在 URL 中，因此可以通过书签或链接打开相同的视图。
          p2: 按列表筛选时，会显示该列表的练习次数和最佳记录，并可通过“开始练习”立即练习。选择包后，列表的选项仅限该包中的列表。包含 2 个以上列表的包，其记录会显示为“包名 › 列表名”。
          p3: 每个列表的最佳记录会带有“最佳”标记。删除最佳记录时，确认画面会显示下一个将成为最佳的记录。
        best:
          title: 最佳记录
          p1: 在<rankings>最佳记录</rankings>中选择列表后，会显示个人最佳、最近 5 次的平均值、用时变化以及排名靠前的记录。最佳记录画面会按包归类列表。每个包会显示练习次数、已练习的列表数（已练习 n/m）、最后练习的时间，以及最近 7 天内刷新最佳的列表数。排序以包为单位，包内的列表按难度顺序排列。
          p2: 排名可在“正确率优先”（正确率从高到低，相同时按速度从快到慢）和“速度优先”之间切换，并可按设备筛选。所选列表和条件会保留在 URL 中。
          p3: 练习画面也会显示所选列表的前 5 条记录，并突出显示本次的记录。
        wordCount:
          title: 单词数变化时
          p1: 添加或删除列表中的单词后，只有以当前单词数练习的记录才会参与排名。练习画面和练习记录中的最佳记录也采用相同的标准。
          p2: 单词数不同的记录，可以通过最佳记录中的“包含并显示”加入排名。如果还没有当前单词数的记录，则按单词数不同的记录进行排名。
        home:
          title: 首页
          text: 有 1 条以上记录后，<home>首页</home>会显示本周的练习次数、连续练习天数、平均正确率和练习时间，接下来适合练习的列表，以及各列表每个单词所需秒数和正确率的变化。日期按设备的时间划分，每周从星期一开始。
      devices:
        lead: 在<devices>设备</devices>中登记练习用的电脑或键盘后，记录中会保留是在哪台设备上练习的。
        p1: 在练习画面的“设备”中选择的设备会记在此浏览器中，下次练习时继续使用。选择之前使用“默认”。
        p2: 可以按设备筛选练习记录和最佳记录。
        p3: 即使更改设备名称，之前的记录仍会保留练习时的名称。最多可以登记 100 台设备。
      storage:
        lead: 登录是可选的。数据的保存位置取决于是否已登录。
        browser:
          title: 保存在此浏览器
          when: 未登录时
          p1: 可以使用全部功能。
          p2: 数据保存在此浏览器的 LocalStorage 中，不会与其他设备或浏览器同步。
        account:
          title: 保存到账号
          when: 登录后（GitHub 或 ID 与密码）
          p1: 数据保存在账号专用的服务器上，只要登录，在任何设备上都能使用相同的数据。
          p2: 保存需要联网。
        warning:
          title: 数据会丢失的情况
          p1: 保存在此浏览器中的数据，会在清除浏览器的网站数据时丢失。重要的列表可以通过“导出 CSV”进行备份。
          p2: 删除列表时，该列表的练习记录也会一并删除。
        notes:
          p1: 两个保存位置的数据是分开保存的，登录后也不会自动转移。
          p2: 旧版本（v0.1.x）的数据，可以通过<home>首页</home>的迁移按钮添加到当前的保存位置。
          p3: 如果因在多个窗口中同时修改而无法保存，请先加载最新数据，然后再操作一次。
      shortcuts:
        lead: 无需鼠标即可操作的按键一览。
        anyKey: 任意键
        screens:
          practice: 开始练习
          complete: 练习完成画面
          editor: 创建列表・编辑单词列表
        actions:
          restart: 从头重新开始
          resume: 点击输入框外部后，返回输入
          again: 再练一次
          next: 移到下一个单词（在最后一个单词上则新增一行）
          move: 将单词上移或下移一位
          save: 保存（Mac 上为 ⌘ + Enter）
      cta:
        text: 准备好了，就马上开始练习吧。
        action: 开始练习
    home:
      welcome:
        title: 用自己的单词，练习打字。
        text: 可以先用官方单词包开始练习，也可以创建一个想要记住的单词列表。
        lists: 单词列表 %{count} 个
        practices: 已完成练习 %{count} 次
        navLabel: 开始使用
        play: 开始练习
        create: 创建单词列表
        records: 查看记录
      storage: 无需登录即可使用全部练习和编辑功能。单词列表、练习记录和设备会保存在此浏览器中。登录（GitHub 或 ID 与密码）后，将切换到另一个保存位置——账号，并可在设备之间同步。浏览器中的数据不会自动迁移。
      storageAccount: 你已登录，单词列表、练习记录和设备会保存到账户中，并与登录同一账户的其他设备和浏览器同步。它们与未登录时保存在此浏览器中的数据分开保存。
      links: "<guide>使用方法</guide> ／ <about>关于 Typle</about>"
    input:
      title: 输入
      metaTitle: 输入 | Typle
      description: 练习时输入文字的相关设置。
      note: 此设置保存在此浏览器中。
      unsaved: 无法保存设置，仅在此页面打开期间有效。
      simpleSpecial:
        heading: 特殊字符简易输入
        description: 对于捷克语、西班牙语等中带有重音符、波浪符等符号的字母（如 í、ó、ñ、č），可以直接输入不带符号的字母（i、o、n、c）。直接输入带符号的字母同样算正确。 俄语西里尔字母也支持拉丁字母输入，例如 привет → privet、школа → shkola、я → ya。直接输入西里尔字母同样算正确。
        label: 使用特殊字符简易输入
        hint: 开启后，可以输入 á → a、č → c、ш → sh、я → ya。
      simpleTable:
        heading: 简易输入对照表
        description: 开启特殊字符简易输入后，可以代替各个字母输入的按键。
        latin: 带符号的拉丁字母
        other: 其他符号
        cyrillic: 西里尔字母（俄语）
        letter: 字母
        key: 输入的按键
        capitals: 大写字母也同样适用（Á → A，Ш → Sh 或 SH）。
      ignoreCase:
        heading: 不区分大小写
        description: 将 A 和 a 这样的大写和小写字母视为同一个字母。无论是否按 Shift 键输入都算正确。
        label: 不区分大小写
        hint: 开启后，A、É 等大写字母输入 a、é 也算正确（反之亦然）。
