    format:
      today: 今日
      yesterday: 昨日
      dateWithWeekday: "%{date}（%{weekday}）"
      units:
        hours: 時間
        minutes: 分
        seconds: 秒
      time:
        one: "%{value}%{unit}"
        two: "%{first}%{firstUnit}%{second}%{secondUnit}"
      defaultDevice: デフォルト
      noDevice: 未記録
      noDeviceRecorded: 端末の記録なし
      deviceWithLayout: "%{name}（%{layout}）"
    globalError:
      title: 画面を表示できませんでした
      description: しばらくしてから、もう一度お試しください。
      reload: 再読み込み
    guide:
      meta:
        title: 使い方 | Typle
        description: Typleの練習の始め方、単語リストの作り方、記録の見方、データの保存先、キーボード操作をまとめています。
      title: 使い方
      intro: 練習の始め方から、単語リストの作り方、記録の見方、データの保存先までをまとめています。ログインしなくても、すべての機能を使えます。
      contentsLabel: このページの内容
      contents:
        practice: 練習する
        lists: 単語リストを作る
        records: 結果と記録を見る
        devices: 端末を登録する
        storage: 保存先とデータ
        shortcuts: キーボード操作
      start:
        title: はじめの3ステップ
        follow:
          title: 公式パックをフォローする
          text: Go・Kotlin などの公式パックをフォローすると、自分のパック一覧に並び、すぐに練習できます。
          action: 公式パック
        create:
          title: 自分のパックを作る
          text: 既存の単語リストを選んで、パックにまとめます。単語リストは単体で作成でき、CSVファイルからも取り込めます。
          action: パックを作成
        review:
          title: 記録を振り返る
          text: 最後まで打つと記録が自動で保存され、自己ベストや所要時間の推移を確認できます。
          action: ベスト記録
      legend:
        typed: 入力：<mono>%{typed}</mono>
        swatch: あ
        done:
          label: 入力済み
          note: "（緑）"
        current:
          label: 次に打つ文字
          note: "（下線）"
        pending:
          label: まだの文字
          note: "（白／ライトテーマでは黒）"
        error:
          label: 間違えた文字
          note: "（赤）"
      practice:
        lead: "<play>練習する</play>で単語リストを選び、表示された単語をタイプします。"
        colors:
          title: 入力の色
          text: 正しく打った文字は緑になり、次の文字に進みます。違う文字を打つと次に打つ文字が赤くなり、正しい文字を打つまで先に進みません。入力欄はなく、表示された単語の下線が今の入力位置です。表示する単語と入力する文字が違う単語（例：「東京」を「とうきょう」と打つ）は、表示の下に入力する文字を出し、そちらに色を付けます。
        flow:
          title: 練習の流れ
          p1: すべての文字が一致すると次の単語へ進み、最後の単語で完了します。
          p2: 最初の入力から完了までを計時し、練習中は経過時間・速度（1分あたりに正しく入力した文字数）・正確率・ミス数を表示します。
          p3: 日本語は IME で確定した文字で判定します。変換中の文字は判定しません。貼り付けとドラッグ入力は使えません。
          p4: 進捗バーの下に次の3語を表示し、「すべての単語を表示」で全体を確認できます。
          p5: 上部の目のボタンで、練習中の記録（経過時間・速度・正確率・ミス数）の表示と非表示を切り替えられます。選んだ状態はこのブラウザーに保存されます。非表示にしても計時と記録の保存は変わらず、結果画面には数値を表示します。
          p6: 上部の「思い出して打つ」を入れると、答えを隠して練習します。補足は答えの部分を伏せて表示し、答えは未入力の文字数だけ「＿」で示します。次の単語・すべての単語・入力する文字の案内は表示しません。「答えを見る」で答えを表示でき、残りの文字はミスに数えます。この練習の記録は「思い出す」として、通常の記録とは分けて比べます。選んだ状態はこのブラウザーに保存され、練習の途中では切り替えられません。
        choose:
          title: パック・リスト・端末を選ぶ
          p1: 上部の「パック名 › リスト名」を押すと、パックを選んで練習するリストを切り替えられます。パックは最近練習した順に並び、パック名・カテゴリ・タグ・リスト名・単語で検索できます。リストが1つのパックは、選ぶとすぐそのリストになります。リストが複数のパックでは、難易度があるリストは難易度のボタンで、難易度のないリストは名前のボタンで選びます。右側（スマートフォンでは下）の一覧からも選べます。
          p2: 練習の途中で別のリストを選ぶと、中断してよいか確認します。途中までの練習は記録しません。
          p3: "「やり直す」または <keys>Esc</keys> で、同じリストを最初からやり直します。"
          p4: 上部の「端末」で、練習に使う端末を最初の文字を打つ前に選びます（<devicesSection>端末を登録する</devicesSection>）。
        writing:
          title: Typle Handwriting（手書き）
          p1: 単語リストの編集画面で「手書き練習（Typle Handwriting）に使う」をオンにして言語を選ぶと、そのリストを手書きで練習できます。練習画面でそのリストを選ぶと「タイピング／Handwriting」の切り替えが出ます。
          p2: 表示された単語を見ながら、OS の手書き入力（Windows の手書きパネル、Android タブレットの手書きキーボード、IME の手書きなど）で入力欄に書きます。Web 版にキャンバスはありません。
          p3: 入力が単語と一致すると次へ進みます。一致しないまま「判定」（<keys>Enter</keys>）を押すとミスを1つ数え、「飛ばす」でもミスを1つ数えて次へ進みます。変換中の文字は判定しません。
          p4: Handwriting の記録は通常の記録・思い出して打った記録と分けて比べ、ベスト記録の画面で「通常／思い出す／Handwriting」を切り替えて見ます。ホームの今週の回数・練習時間・連続日数には数えますが、正確率・推移・次に練習するリストはタイピングの記録だけで比べます。Handwriting と「思い出して打つ」は一緒に使えません。練習の途中で切り替えるときは確認します。スマートフォンは今後の対象です。
      lists:
        lead: "<create>パックを作成</create>で新しいパックを作り、<edit>単語パック</edit>で保存したパックとリストを編集します。"
        packs:
          title: パックとリスト
          p1: 単語リストは「パック」にまとめて管理します。単語リストは単体で作成でき、パックの作成では、パックの名前とまとめる単語リストを選びます。
          p2: パックの「…」メニューの「リストを追加」で、保存したパックにリストを足せます。
          p3: パックの「…」メニューの「パックを編集」では、名前・説明・カテゴリ・タグを変えたり、中のリストを並べ替えたりできます。
          p4: リストの編集画面では、入れるパックを選び直せます（別のパックへ移せます）。単語の目安として難易度も1つ入力できます。
        files:
          title: パックのコピー・ファイル・公式パック
          p1: パックの「…」メニューの「複製」で、パックをリストごとコピーできます。名前は「名前（コピー）」になり、元のパックの直後に入ります。練習記録は写しません。
          p2: パックの「…」メニューの「書き出す」で、パックを「パック名.typle-pack.json」ファイルに保存できます。名前・説明・カテゴリ・タグ・リスト・単語を含み、練習記録は含みません。
          p3: "「ファイルから取り込む」でそのファイルを選ぶと、新しいパックとして取り込みます（単語パックが空のときも使えます）。1 MiB までで、読めないファイルは取り込めません。同じ名前のパックがあるときは「名前（2）」になります。"
          p4: 単語パックの「公式パック」で「フォローする」を押すと、そのパックが自分のパック一覧に加わります。フォロー中のパックには「公式」と表示し、公式の更新がそのまま反映されます。フォロー中のパックは編集できないので、手を加えたいときは「複製」で自分のパックにします。「フォロー解除」でパックは一覧から消え、練習記録も消えます。
        interests:
          title: 関心
          p1: "<interests>関心</interests>で「語学」「プログラミング」のチップを選べます。いくつでも選べて、押した時点で保存されます。はじめはすべてのチップが選ばれていて、すべての公式パックが関心に合います。"
          p2: 親のチップを選ぶと、その下に「中国語」「ロシア語」「韓国語」や「Go」「Kotlin」などのチップが開きます。親の選択を外すと、その下の選択も外れます。
          p3: 関心を選ぶと、単語パックの「公式パック」が「関心に合うパック」と「そのほかのパック」に分かれます。下のチップを選んでいなければその分野のパックすべてが、選んでいればそのタグのパックが「関心に合うパック」になります。関心の画面でも、チップの下に関心に合う公式パックが「パック名」「含まれる単語リスト」「単語数」とスイッチ付きで並びます。スイッチをオンにして画面下の「追加」を押すとフォローし、フォロー中のパックのスイッチをオフにして「追加」を押すとフォローを解除します（記録も消えます）。
          p4: 関心は、ログインしているとアカウントに、ログインしていないときはこのブラウザーに保存されます。
        share:
          title: パックを人に渡す
          p1: パックを人に渡すときは、パックの「…」メニューの「書き出す」で「パック名.typle-pack.json」ファイルを、リストごとなら「CSVエクスポート」で CSV ファイルを書き出して送ります。練習記録は含みません。
          p2: 受け取った人は、パックのファイルを「ファイルから取り込む」で、CSV ファイルをリストの編集中に「CSVを読み込む」で取り込めます。
        input:
          title: 単語を入力する
          p1: リスト名と、単語ごとに「表示する単語」「入力する文字」を入力します。補足は任意です。
          p2: 入力する文字を空欄にすると、表示する単語と同じ文字を使います。
          p3: 単語はドラッグ、「…」メニュー、<keys>Alt+↑↓</keys> で並べ替えられます。<keys>Enter</keys> で次の単語へ移り、最後の単語では新しい行を追加します。
          p4: "「保存」または <keys>Ctrl+Enter</keys>（Mac は <keys>⌘+Enter</keys>）で保存します。"
        cannotSave:
          title: 保存できないとき
          p1: 空の行があるリスト、単語のないリスト、同じパックの中に同じ名前があるリストは保存できません。
          p2: 1つのリストに入れられる単語は1,000語まで、保存できるリストは150件までです。
          p3: 保存していない変更があるときは、キャンセルやブラウザーの戻るの前に確認します。
          p4: 単語数を変えると、それまでの記録はベスト記録の順位から外れます（記録は残ります。<wordCount>単語数を変えたとき</wordCount>）。
        manage:
          title: リストを管理する
          p1: "<edit>単語パック</edit>では、パック名やリスト名、単語で検索し、並び順を変えられます。"
          p2: パックの「…」メニューから、練習・パックを編集・リストを追加・削除ができます。パックを削除すると、中のリストと練習記録も削除されます。リストごとの行にも「…」メニューがあり、ベスト記録・練習記録・CSVエクスポート・複製・削除ができます。公式パックのフォロー中のパックは編集できず、削除の代わりに「フォロー解除」があります。
          p3: 複製では、リストの単語だけを写します。練習記録は写しません。パックを複製したときも同じです。
        csv:
          title: CSVファイル
          p1: リストの編集中に「CSVを読み込む」でファイルを選ぶと、内容を確認してから、今の単語の末尾に追加するか置き換えるかを選べます。
          p2: 1行目は列名です。input（入力する文字）と display（表示する単語）が必要で、annotation（補足）は省略できます。UTF-8 で保存した 1 MiB 以内・1,000語までのファイルを読み込めます。
          p3: "「CSVエクスポート」は、入力・表示・補足を UTF-8 の CSV ファイルに書き出します（練習記録は含みません）。書き出したファイルはそのまま読み込めます。"
          exampleLabel: CSVファイルの例
          example: |-
            input,display,annotation
            とうきょう,東京,日本の首都
            おおさか,大阪,
      records:
        lead: 練習を最後まで終えると、記録を自動で保存します。
        complete:
          title: 完了画面
          p1: 所要時間、正確率とミス文字数、速度、間違えた単語の数と端末を表示します。その下に、間違えた単語と最初に間違えた文字を並べます。「間違えた単語だけ練習する」で、その単語だけをおさらいできます（おさらいは記録しません）。
          p2: 正確率は、入力した文字のうち正しかった文字の割合です。削除操作は数えず、訂正して打ち直した文字は数えます。
          p3: 自己ベストを更新すると、バッジと前のベストとの差を表示します。
          p4: "「もう一度」（<keys>Enter</keys>）で、同じリストをすぐに練習できます。保存に失敗したときは「記録の保存を再試行」を押してください。"
        history:
          title: 練習記録
          p1: "<records>練習記録</records>では、練習の履歴を日付ごとに新しい順で表示し、リストや端末で絞り込めます。絞り込みは URL に残るので、ブックマークやリンクで同じ表示を開けます。"
          p2: リストで絞り込むと、そのリストの練習回数とベストを表示し、「練習する」からすぐに練習できます。パックで絞り込むと、リストの選択肢はそのパックのリストだけになります。2リスト以上のパックの記録には「パック名 › リスト名」と表示します。
          p3: 各リストのベストには「ベスト」の印が付きます。ベストを削除するときは、次にベストになる記録を確認画面に表示します。
        best:
          title: ベスト記録
          p1: "<rankings>ベスト記録</rankings>でリストを選ぶと、自己ベスト・直近5回の平均・所要時間の推移と上位の記録を表示します。ベスト記録の画面は、リストをパックごとにまとめます。パックには、練習回数・練習済みのリスト数（練習済み n/m）・最後に練習した日時・直近7日以内にベストを更新したリストの数を表示します。並べ替えはパック単位で、パックの中のリストは難易度の順です。"
          p2: 順位は「正確率を優先」（正確率が高い順、同じなら速い順）と「速さを優先」を切り替えられ、端末で絞り込めます。選んだリストと条件は URL に残ります。
          p3: 練習画面にも、選んでいるリストの上位5件を表示し、今回の記録を強調します。
        wordCount:
          title: 単語数を変えたとき
          p1: リストの単語を追加・削除した後は、今の単語数で練習した記録だけで順位を付けます。練習画面や練習記録のベストも同じ基準です。
          p2: 単語数が違う記録は、ベスト記録の「含めて表示」で順位に加えられます。今の単語数の記録がまだないときは、単語数が違う記録で順位を付けます。
        home:
          title: ホーム
          text: 記録が1件以上あると、<home>ホーム</home>に今週の練習回数・連続練習日数・平均正確率・練習時間、次に練習するとよいリスト、リストごとの1単語あたりの秒数と正確率の推移を表示します。日付は端末の時刻で区切り、週は月曜はじまりです。
      devices:
        lead: "<devices>端末</devices>に練習で使うパソコンやキーボードを登録すると、どの端末で練習したかが記録に残ります。"
        p1: 練習画面の「端末」で選んだ端末は、このブラウザーで覚えておき、次の練習でも使います。選ぶまでは「デフォルト」を使います。
        p2: 練習記録とベスト記録を端末で絞り込めます。
        p3: 端末の名前を変えても、それまでの記録には練習した時点の名前が残ります。登録できる端末は100台までです。
      storage:
        lead: ログインは任意です。ログインしているかどうかで、データの保存先が変わります。
        browser:
          title: このブラウザーに保存
          when: ログインしていないとき
          p1: すべての機能を使えます。
          p2: このブラウザーの LocalStorage に保存します。別の端末やブラウザーとは同期しません。
        account:
          title: アカウントに保存
          when: ログインしたとき（GitHub または ID とパスワード）
          p1: アカウント専用のサーバーに保存し、ログインすればどの端末でも同じデータを使えます。
          p2: 保存にはインターネット接続が必要です。
        warning:
          title: データが消えるとき
          p1: このブラウザーに保存したデータは、ブラウザーのサイトデータを削除すると消えます。大切なリストは「CSVエクスポート」で書き出しておけます。
          p2: リストを削除すると、そのリストの練習記録も削除されます。
        notes:
          p1: 2つの保存先のデータは別々に保存され、ログインしても自動では移りません。
          p2: 以前のバージョン（v0.1.x）のデータは、<home>ホーム</home>の移行ボタンで今の保存先に追加できます。
