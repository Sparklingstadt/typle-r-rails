# typle-r's messages with more than one plural or a select, kept in their ICU form (IcuMessage).
zh-Hans:
  typle:
    dashboard:
      change:
        same: __icu:{recent, select, none {与} latest {最新记录与} other {最近 {recentCount}
          次的平均与}}{previous, select, latest {上一次记录} other {之前 {previousCount} 次}}相同
        different: __icu:{recent, select, none {} latest {最新记录} other {最近 {recentCount}
          次的平均}}比{previous, select, latest {上一次记录} other {之前 {previousCount} 次}}{difference}
        seconds: __icu:{direction, select, up {慢 {value} 秒} other {快 {value} 秒}}
        points: __icu:{direction, select, up {高 {value}pt} other {低 {value}pt}}
    devices:
      deleteDescription: __icu:{removal}{records}{current, select, yes {此浏览器练习时使用的设备将恢复为“默认”。}
        other {}}
    interests:
      packs:
        done: '__icu:{followed, plural, =0 {} other {已关注 # 个包。}}{unfollowed, plural,
          =0 {} other {已取消关注 # 个包。}}'
