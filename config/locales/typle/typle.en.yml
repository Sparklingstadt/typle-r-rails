    guide:
      meta:
        title: How to use | Typle
        description: How to start practicing in Typle, create word lists, read your records, where your data is saved, and keyboard shortcuts.
      title: How to use
      intro: Everything from getting started with practice to creating word lists, reading your records, and where your data is saved. All features work without signing in.
      contentsLabel: On this page
      contents:
        practice: Practice
        lists: Create word lists
        records: Results and records
