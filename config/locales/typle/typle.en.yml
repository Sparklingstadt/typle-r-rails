      practice:
        lead: Choose a word list in <play>Practice</play> and type the words shown.
        colors:
          title: Input colors
          text: 'Correctly typed characters turn green and you move on to the next one. If you type a wrong character, the character to type turns red and you don’t move on until you type the right one. There is no input field: the underline in the word shows where you are. For words whose displayed text differs from what you type (for example, typing “cafe” for “café”), the characters to type appear below the word and are colored instead.'
        flow:
          title: How practice works
          p1: When every character matches, you move on to the next word. The practice ends after the last word.
          p2: Time is measured from your first keystroke until you finish. While you practice, the elapsed time, speed (correct characters per minute), accuracy, and number of mistakes are shown.
          p3: Text typed with an IME (such as Japanese) is checked once it is confirmed; characters still being converted are not checked. Pasting and drag-and-drop input are disabled.
          p4: The next 3 words appear below the progress bar, and “Show all words” lets you see the whole list.
          p5: The eye button at the top shows or hides the live stats (elapsed time, speed, accuracy and mistakes). Your choice is saved in this browser. Hiding them does not change timing or saving, and the result screen still shows the numbers.
          p6: Turn on “Type from memory” at the top to practice with the answer hidden. The note is shown with the answer blanked out, and the answer appears as one “＿” per character still to type. The next words, the full word list and the characters-to-type guide are not shown. “Show answer” reveals it, and the remaining characters count as mistakes. These runs are saved as “Recall” and compared separately from normal runs. Your choice is saved in this browser and cannot be changed during a run.
        choose:
          title: Choosing a pack, list and device
          p1: Click “Pack › List” at the top to choose a pack and switch the list you practice. Packs are ordered by most recent practice and can be searched by pack name, category, tag, list name or word. A pack with one list selects that list right away. In a pack with several lists, lists with a difficulty are chosen with difficulty buttons, and lists without one with name buttons. You can also pick one from the list on the right (below on smartphones).
          p2: If you choose another list in the middle of a practice, you are asked to confirm before stopping. An unfinished practice is not recorded.
          p3: "“Start over” or <keys>Esc</keys> starts the same list over from the beginning."
          p4: Use “Device” at the top to choose the device you are practicing on before typing the first character (<devicesSection>Register devices</devicesSection>).
        writing:
          title: Typle Handwriting
          p1: In the list editor, turn on “Use for handwriting practice (Typle Handwriting)” and pick a language, and you can practise that list by hand. When you choose it on the practice screen, a Typing / Handwriting switch appears.
          p2: Look at the word shown and write it in the field with your OS’s handwriting input (the Windows handwriting panel, the handwriting keyboard of an Android tablet, an IME’s handwriting, and so on). The web version has no drawing canvas.
          p3: When the input matches the word, you move on. Pressing “Check” (<keys>Enter</keys>) without a match counts one miss, and “Skip” counts one miss and moves on. Text still being converted is not judged.
          p4: Handwriting records are compared apart from normal and recall records; on the best-records screen you switch between Normal, Recall and Handwriting. They count towards this week’s runs, practice time and streak on the home screen, but accuracy, trends and the next lists compare typing records only. Handwriting cannot be combined with “Type from memory”. Switching in the middle of a run asks first. Smartphones are a future target.
      lists:
        lead: Create a new pack in <create>Create a pack</create>, and edit saved packs and lists in <edit>Word packs</edit>.
        packs:
          title: Packs and lists
          p1: Word lists are organized into packs. A word list can be created on its own; when you create a pack, you enter its name and choose the word lists it holds.
          p2: Use “Add a list” in a pack’s “…” menu to add a list to a saved pack.
          p3: Use “Edit pack” in a pack’s “…” menu to change its name, description, category, and tags, or to reorder the lists inside it.
          p4: In the list editor, you can choose which pack the list belongs to (this moves it to another pack). You can also enter one difficulty for the words.
        files:
          title: Copying packs, pack files, and official packs
          p1: "“Duplicate” in a pack’s “…” menu copies the pack with all its lists. The copy is named “Name (copy)” and placed right after the original. Practice history is not copied."
          p2: "“Export” in a pack’s “…” menu saves the pack to a “pack-name.typle-pack.json” file. It contains the name, description, category, tags, lists, and words, but not practice history."
          p3: Choose that file with “Import from file” to import it as a new pack (this also works when you have no packs yet). Files up to 1 MiB are accepted, and unreadable files are refused. If a pack with the same name exists, the new one is named “Name (2)”.
          p4: In “Official packs” under Word packs, “Follow” puts that pack into your packs. Followed packs are marked “Official” and stay up to date with the official version. A followed pack cannot be edited; to change it, use “Duplicate” to make a pack of your own. “Unfollow” removes the pack from your packs, together with its practice history.
        interests:
          title: Interests
          p1: In <interests>Interests</interests>, pick the “Languages” and “Programming” chips. You can pick any number, and each pick is saved as soon as you press it. At first every chip is picked, so every official pack matches.
          p2: Picking a parent chip opens chips under it, such as “Chinese”, “Russian” and “Korean”, or “Go” and “Kotlin”. Unpicking the parent also unpicks the chips under it.
          p3: With interests picked, “Official packs” under Word packs is split into “Packs matching your interests” and “Other packs”. With no chip picked under a parent, every pack of that field matches; with some picked, the packs with those tags match. The Interests screen also lists the official packs that fit, under the chips, with their name, word lists, word count and a switch. Switch packs on and press “Add” at the bottom to follow them; switch a followed pack off and press “Add” to unfollow it (its practice history is deleted).
          p4: Interests are saved to your account when you are signed in, and in this browser when you are not.
        share:
          title: Giving a pack to someone
          p1: To give a pack to someone, save it to a “pack-name.typle-pack.json” file with “Export” in the pack’s “…” menu, or save one list to a CSV file with “Export CSV”, and send them the file. Practice history is not included.
          p2: They can import a pack file with “Import from file”, and a CSV file with “Import CSV” while editing a list.
        input:
          title: Entering words
          p1: Enter a list name and, for each word, the “Word to display” and the “Text to type”. The note is optional.
          p2: If you leave the characters to type empty, the displayed word is typed as is.
          p3: Reorder words by dragging, from the “…” menu, or with <keys>Alt+↑↓</keys>. <keys>Enter</keys> moves to the next word, and adds a new row on the last word.
          p4: Save with “Save” or <keys>Ctrl+Enter</keys> (<keys>⌘+Enter</keys> on Mac).
        cannotSave:
          title: When a list cannot be saved
          p1: Lists with empty rows, lists without words, and lists with the same name as another list in the same pack cannot be saved.
          p2: A list can hold up to 1,000 words, and you can save up to 150 lists.
          p3: If you have unsaved changes, you are asked to confirm before canceling or going back in the browser.
          p4: If you change the number of words, earlier records drop out of the best-record rankings (the records themselves are kept; see <wordCount>When the word count changes</wordCount>).
        manage:
          title: Managing lists
          p1: In <edit>Word packs</edit>, you can search by pack name, list name, or word and change the sort order.
          p2: From a pack’s “…” menu you can practice, edit the pack, add a list, or delete it. Deleting a pack also deletes its lists and their practice history. Each list row has its own “…” menu for best records, practice history, CSV export, duplicating, and deleting. Followed official packs cannot be edited, and have “Unfollow” instead of delete.
          p3: Duplicating copies only the words, not the practice history. The same applies when you duplicate a pack.
        csv:
          title: CSV files
          p1: While editing a list, choose a file with “Import CSV”. After reviewing its contents, you can add the words to the end of the current ones or replace them.
          p2: The first row holds the column names. input (characters to type) and display (word to display) are required; annotation (note) is optional. You can import UTF-8 files of up to 1 MiB and 1,000 words.
          p3: "“Export CSV” writes each word’s input, display text, and note to a UTF-8 CSV file (practice history is not included). Exported files can be imported as they are."
          exampleLabel: Example CSV file
          example: |-
            input,display,annotation
            cafe,café,coffee shop
            naive,naïve,
      records:
        lead: When you finish a practice, the record is saved automatically.
        complete:
          title: Completion screen
          p1: Shows the time, accuracy and number of mistyped characters, speed, number of missed words, and device. Below, the missed words are listed with the first character that went wrong. “Practice the missed words” runs just those words again as a review, which is not recorded.
          p2: Accuracy is the share of typed characters that were correct. Deletions are not counted, but characters you retype after a correction are.
          p3: When you beat your personal best, a badge and the difference from your previous best are shown.
          p4: "“Again” (<keys>Enter</keys>) lets you practice the same list right away. If saving fails, press “Try saving again”."
        history:
          title: Practice history
          p1: "<records>Practice history</records> lists your practices by date, newest first, and can be filtered by list or device. Filters are kept in the URL, so you can open the same view from a bookmark or link."
          p2: When filtered by a list, it shows how many times you have practiced that list and your best, and you can start practicing right away with “Practice”. Choosing a pack limits the list choices to that pack’s lists. Records of packs with two or more lists show “pack › list”.
          p3: The best record of each list is marked “Best”. When you delete a best, the confirmation shows which record will become the next best.
        best:
          title: Best records
          p1: Choose a list in <rankings>Best records</rankings> to see your personal best, the average of your last 5 runs, how your time has changed, and your top records. The best-records screen groups lists by pack. Each pack shows its practice count, how many lists you have practiced (n/m practiced), when you last practiced, and how many lists set a new best in the last 7 days. Sorting applies to packs, and the lists inside a pack stay in difficulty order.
          p2: You can switch the ranking between “Accuracy first” (highest accuracy first, then fastest) and “Speed first”, and filter it by device. The selected list and options are kept in the URL.
          p3: The practice screen also shows the top 5 records for the selected list and highlights your latest one.
        wordCount:
          title: When the word count changes
          p1: After you add or remove words in a list, only records practiced with the current number of words are ranked. The bests on the practice screen and in practice history follow the same rule.
          p2: Records with a different word count can be added to the ranking with “Include” in Best records. If there are no records with the current word count yet, records with a different word count are ranked.
        home:
          title: Home
          text: Once you have at least one record, <home>Home</home> shows this week’s practice count, your practice streak, average accuracy, and practice time, which list to practice next, and how seconds per word and accuracy have changed for each list. Days follow your device’s clock, and weeks start on Monday.
      devices:
        lead: Register the computers and keyboards you practice on in <devices>Devices</devices>, and your records will show which device you used.
        p1: The device you choose with “Device” on the practice screen is remembered in this browser and used for your next practice too. Until you choose one, “Default” is used.
        p2: You can filter practice history and best records by device.
        p3: Renaming a device does not change earlier records; they keep the name the device had when you practiced. You can register up to 100 devices.
      storage:
        lead: Signing in is optional. Where your data is saved depends on whether you are signed in.
        browser:
          title: Saved in this browser
          when: When you are not signed in
          p1: All features are available.
          p2: Data is saved in this browser’s LocalStorage and is not synced with other devices or browsers.
        account:
          title: Saved to your account
          when: When you sign in (with GitHub or an ID and password)
          p1: Data is saved on a server dedicated to your account, so you can use the same data on any device you sign in on.
          p2: Saving requires an internet connection.
        warning:
          title: When data is lost
          p1: Data saved in this browser is deleted when you clear the browser’s site data. You can back up important lists with “Export CSV”.
          p2: Deleting a list also deletes its practice history.
        notes:
          p1: The two storage locations keep their data separately, and nothing is moved automatically when you sign in.
          p2: Data from an earlier version (v0.1.x) can be added to the current storage location with the migration button on <home>Home</home>.
          p3: If saving fails because changes were made in several windows at once, load the latest data and try again.
      shortcuts:
        lead: Keys you can use instead of the mouse.
        anyKey: Any key
        screens:
          practice: Practice
          complete: Practice complete screen
          editor: Create a list / Edit a word list
        actions:
          restart: Start over from the beginning
          resume: Return to typing after clicking outside the input field
          again: Practice again
          next: Move to the next word (adds a row on the last word)
          move: Move a word up or down
          save: Save (⌘ + Enter on Mac)
      cta:
        text: Ready? Let’s start practicing.
        action: Start practicing
