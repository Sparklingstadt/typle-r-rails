        description: What you can do with Typle, where your data is saved, what is sent for analytics, and the version.
      title: About Typle
      intro: A typing app for practicing with word lists you create yourself. Add any words you like, practice them, and track your progress with your best records.
      play: Practice
      guide: How to use
      features:
        title: What you can do
        create:
          title: Create a pack
          description: Add the words you want to learn. The word to display and the characters to type can be set separately, and you can also add words from CSV files.
        play:
          title: Practice
          description: Speed, accuracy, and mistakes are shown as you type, along with where you typed a wrong character.
        rankings:
          title: Best records
          description: See your progress through your personal best, the average of your last 5 runs, and how your time has changed.
      storage:
        title: Where your data is saved
        text: Signing in is optional. Where data is saved depends on whether you are signed in, and the two are kept separately (nothing is moved automatically).
