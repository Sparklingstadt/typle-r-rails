    guide:
      meta:
        title: Mode d’emploi | Typle
        description: Comment commencer à vous entraîner sur Typle, créer des listes de mots, consulter vos résultats, où sont enregistrées vos données et quels sont les raccourcis clavier.
      title: Mode d’emploi
      intro: Tout ce qu’il faut savoir, des premiers pas à la création de listes de mots, en passant par la consultation des résultats et l’enregistrement des données. Toutes les fonctionnalités sont disponibles sans vous connecter.
      contentsLabel: Sur cette page
      contents:
        practice: S’entraîner
        lists: Créer des listes de mots
        records: Résultats et historique
        devices: Enregistrer des appareils
        storage: Stockage et données
        shortcuts: Raccourcis clavier
      start:
        title: Démarrer en 3 étapes
        follow:
          title: Suivre des packs officiels
          text: 'Suivez des packs officiels comme Go ou Kotlin : ils s’ajoutent à vos packs et vous pouvez vous entraîner tout de suite.'
          action: Packs officiels
        create:
          title: Créer votre pack
          text: Choisissez des listes de mots existantes et regroupez-les dans un pack. Une liste de mots se crée seule, et peut aussi être importée depuis un fichier CSV.
          action: Créer un pack
        review:
          title: Suivre vos résultats
          text: 'Une fois la liste terminée, votre résultat est enregistré automatiquement : vous pouvez consulter votre record personnel et l’évolution de votre temps.'
          action: Meilleurs résultats
      legend:
        typed: 'Saisie : <mono>%{typed}</mono>'
        swatch: a
        done:
          label: Saisi
          note: "(vert)"
        current:
          label: Caractère suivant
          note: "(souligné)"
        pending:
          label: Pas encore saisi
          note: "(blanc, noir avec le thème clair)"
        error:
          label: Caractère erroné
          note: "(rouge)"
      practice:
        lead: Choisissez une liste de mots dans <play>S’entraîner</play> et tapez les mots affichés.
        colors:
          title: Couleurs de saisie
          text: 'Les caractères bien tapés deviennent verts et vous passez au suivant. Si vous tapez un mauvais caractère, le caractère à taper devient rouge et vous n’avancez pas tant que vous n’avez pas tapé le bon. Il n’y a pas de champ de saisie : le soulignement dans le mot indique votre position. Pour les mots dont l’affichage diffère de ce qu’il faut taper (par exemple taper « noel » pour « Noël »), les caractères à taper s’affichent sous le mot et ce sont eux qui sont colorés.'
        flow:
          title: Déroulement de l’entraînement
          p1: Quand tous les caractères correspondent, vous passez au mot suivant ; l’entraînement se termine après le dernier mot.
          p2: Le temps est mesuré de la première frappe jusqu’à la fin. Pendant l’entraînement, le temps écoulé, la vitesse (caractères corrects par minute), la précision et le nombre d’erreurs sont affichés.
          p3: Le texte saisi avec un IME (en japonais, par exemple) est vérifié une fois validé ; les caractères en cours de conversion ne sont pas vérifiés. Le collage et la saisie par glisser-déposer sont désactivés.
          p4: Les 3 mots suivants s’affichent sous la barre de progression, et « Afficher tous les mots » permet de voir la liste entière.
          p5: Le bouton en forme d’œil, en haut, affiche ou masque les statistiques en direct (temps écoulé, vitesse, précision et erreurs). Votre choix est enregistré dans ce navigateur. Les masquer ne change ni le chronométrage ni l’enregistrement, et l’écran de résultat affiche toujours les chiffres.
          p6: Activez « Taper de mémoire » en haut pour vous entraîner avec la réponse cachée. La note s’affiche avec la réponse masquée, et la réponse apparaît sous la forme d’un « ＿ » par caractère restant à taper. Les mots suivants, la liste complète et le guide des caractères à taper ne sont pas affichés. « Voir la réponse » l’affiche, et les caractères restants comptent comme des erreurs. Ces entraînements sont enregistrés comme « De mémoire » et comparés séparément des entraînements normaux. Votre choix est enregistré dans ce navigateur et ne peut pas être changé pendant un entraînement.
        choose:
          title: Choisir le pack, la liste et l’appareil
          p1: Cliquez sur « Pack › Liste » en haut pour choisir un pack et changer de liste. Les packs sont triés par entraînement le plus récent et se recherchent par nom de pack, catégorie, tag, nom de liste ou mot. Un pack d’une seule liste sélectionne cette liste aussitôt. Dans un pack de plusieurs listes, les listes avec une difficulté se choisissent avec des boutons de difficulté, et celles sans difficulté avec des boutons portant leur nom. Vous pouvez aussi choisir dans la liste de droite (en bas sur smartphone).
          p2: Si vous choisissez une autre liste en cours d’entraînement, une confirmation vous est demandée avant l’interruption. Un entraînement inachevé n’est pas enregistré.
          p3: "« Recommencer » ou <keys>Esc</keys> relance la même liste depuis le début."
          p4: Avant de taper le premier caractère, choisissez l’appareil utilisé avec « Appareil » en haut (<devicesSection>Enregistrer des appareils</devicesSection>).
        writing:
          title: Typle Handwriting (écriture manuscrite)
          p1: Dans l’éditeur de liste, activez « Utiliser pour l’écriture manuscrite (Typle Handwriting) » et choisissez une langue pour vous entraîner à écrire cette liste à la main. En la choisissant sur l’écran d’entraînement, un sélecteur Frappe / Handwriting apparaît.
          p2: Regardez le mot affiché et écrivez-le dans le champ avec la saisie manuscrite de votre système (panneau d’écriture de Windows, clavier manuscrit d’une tablette Android, écriture manuscrite d’un IME, etc.). La version web n’a pas de zone de dessin.
          p3: Quand la saisie correspond au mot, vous passez au suivant. « Vérifier » (<keys>Enter</keys>) sans correspondance compte une erreur, et « Passer » compte une erreur et passe au mot suivant. Le texte en cours de conversion n’est pas évalué.
          p4: Les records Handwriting sont comparés à part des records normaux et de mémoire ; sur l’écran des meilleurs records, on bascule entre Normal, De mémoire et Handwriting. Ils comptent dans les séances, le temps d’entraînement et la série de la semaine sur l’accueil, mais la précision, les tendances et les listes suivantes ne comparent que la frappe. Handwriting ne se combine pas avec « Taper de mémoire ». Changer en cours d’entraînement demande une confirmation. Les smartphones seront pris en charge plus tard.
      lists:
        lead: Créez un pack dans <create>Créer un pack</create> et modifiez vos packs et listes enregistrés dans <edit>Packs de mots</edit>.
        packs:
          title: Packs et listes
          p1: Les listes de mots sont regroupées en « packs ». Une liste de mots se crée seule ; pour créer un pack, saisissez son nom et choisissez les listes qu'il regroupe.
          p2: "« Ajouter une liste », dans le menu « … » d’un pack, ajoute une liste à un pack enregistré."
          p3: "« Modifier le pack », dans le menu « … » d’un pack, permet de changer son nom, sa description, sa catégorie et ses tags, ou de réorganiser les listes qu’il contient."
          p4: Dans l’éditeur de liste, vous pouvez choisir le pack de la liste (ce qui la déplace vers un autre pack). Vous pouvez aussi saisir une difficulté.
        files:
          title: Copie de packs, fichiers de pack et packs officiels
          p1: "« Dupliquer », dans le menu « … » d’un pack, copie le pack avec ses listes. La copie s’appelle « Nom (copie) » et se place juste après l’original. L’historique d’entraînement n’est pas copié."
          p2: "« Exporter », dans le menu « … » d’un pack, enregistre le pack dans un fichier « nom-du-pack.typle-pack.json ». Il contient le nom, la description, la catégorie, les tags, les listes et les mots, mais pas l’historique."
          p3: Choisissez ce fichier avec « Importer depuis un fichier » pour l’importer comme nouveau pack (cela fonctionne aussi quand vous n’avez encore aucun pack). Les fichiers vont jusqu’à 1 Mio ; un fichier illisible est refusé. Si un pack du même nom existe, le nouveau s’appelle « Nom (2) ».
          p4: 'Dans « Packs officiels », parmi les packs de mots, « Suivre » ajoute ce pack à vos packs. Les packs suivis portent la mention « Officiel » et restent à jour avec la version officielle. Un pack suivi ne peut pas être modifié : pour le changer, utilisez « Dupliquer » afin d’en faire votre propre pack. « Ne plus suivre » retire le pack de vos packs, avec son historique d’entraînement.'
        interests:
          title: Centres d’intérêt
          p1: 'Dans <interests>Centres d’intérêt</interests>, choisissez les puces « Langues » et « Programmation ». Vous pouvez en choisir autant que vous voulez ; chaque choix est enregistré dès que vous appuyez. Au départ, toutes les puces sont choisies : tous les packs officiels correspondent.'
          p2: Choisir une puce parente ouvre les puces en dessous, comme « Chinois », « Russe » et « Coréen », ou « Go » et « Kotlin ». Désélectionner la parente désélectionne aussi les puces en dessous.
          p3: Avec des centres d’intérêt choisis, « Packs officiels » parmi les packs de mots est séparé en « Packs correspondant à vos centres d’intérêt » et « Autres packs ». Sans puce choisie sous une parente, tous les packs de ce domaine correspondent ; avec des puces choisies, ce sont les packs portant ces étiquettes. L’écran Centres d’intérêt affiche aussi, sous les puces, les packs officiels qui correspondent, avec leur nom, leurs listes de mots, leur nombre de mots et un interrupteur. Activez des packs puis appuyez sur « Ajouter » en bas pour les suivre ; désactivez un pack suivi puis appuyez sur « Ajouter » pour ne plus le suivre (son historique d’entraînement est supprimé).
          p4: Les centres d’intérêt sont enregistrés dans votre compte si vous êtes connecté, et dans ce navigateur sinon.
        share:
          title: Donner un pack à quelqu’un
          p1: Pour donner un pack à quelqu’un, enregistrez-le dans un fichier « nom-du-pack.typle-pack.json » avec « Exporter » dans le menu « … » du pack, ou une liste dans un fichier CSV avec « Exporter en CSV », puis envoyez le fichier. L’historique d’entraînement n’est pas inclus.
          p2: La personne importe un fichier de pack avec « Importer depuis un fichier », et un fichier CSV avec « Importer un CSV » pendant la modification d’une liste.
        input:
          title: Saisir les mots
          p1: Saisissez le nom de la liste puis, pour chaque mot, le « Mot affiché » et le « Texte à saisir ». La note est facultative.
          p2: Si vous laissez le texte à saisir vide, le mot affiché est utilisé tel quel.
          p3: Réorganisez les mots par glisser-déposer, avec le menu « … » ou avec <keys>Alt+↑↓</keys>. <keys>Enter</keys> passe au mot suivant et, sur le dernier mot, ajoute une nouvelle ligne.
          p4: Enregistrez avec « Enregistrer » ou <keys>Ctrl+Enter</keys> (<keys>⌘+Enter</keys> sur Mac).
        cannotSave:
          title: Si la liste ne peut pas être enregistrée
          p1: Une liste avec des lignes vides, une liste sans mots ou une liste portant le même nom qu’une autre liste du même pack ne peut pas être enregistrée.
          p2: Une liste peut contenir jusqu’à 1 000 mots, et vous pouvez enregistrer jusqu’à 150 listes.
          p3: Si des modifications ne sont pas enregistrées, une confirmation vous est demandée avant d’annuler ou de revenir en arrière dans le navigateur.
          p4: Si vous modifiez le nombre de mots, les résultats précédents ne comptent plus dans le classement des meilleurs résultats (ils sont conservés ; voir <wordCount>Si le nombre de mots change</wordCount>).
        manage:
          title: Gérer les listes
          p1: Dans <edit>Packs de mots</edit>, vous pouvez rechercher par nom de pack, nom de liste ou mot et changer l’ordre de tri.
          p2: 'Le menu « … » d’un pack permet de s’entraîner, de modifier le pack, d’ajouter une liste ou de le supprimer. Supprimer un pack supprime aussi ses listes et leur historique. Chaque ligne de liste a son propre menu « … » : meilleurs résultats, historique, export CSV, duplication et suppression. Les packs officiels suivis ne peuvent pas être modifiés et proposent « Ne plus suivre » au lieu de supprimer.'
          p3: La duplication ne copie que les mots, pas l’historique d’entraînement. Il en va de même pour la duplication d’un pack.
        csv:
          title: Fichiers CSV
          p1: Pendant la modification d’une liste, choisissez un fichier avec « Importer un CSV ». Après avoir vérifié son contenu, vous pouvez ajouter les mots à la fin des mots actuels ou les remplacer.
          p2: La première ligne contient les noms de colonnes. input (texte à saisir) et display (mot affiché) sont obligatoires ; annotation (note) est facultative. Vous pouvez importer des fichiers enregistrés en UTF-8, de 1 Mio et 1 000 mots au maximum.
          p3: "« Exporter en CSV » écrit la saisie, l’affichage et la note de chaque mot dans un fichier CSV en UTF-8 (sans l’historique d’entraînement). Le fichier exporté peut être réimporté tel quel."
          exampleLabel: Exemple de fichier CSV
          example: |-
            input,display,annotation
            noel,Noël,fête de fin d’année
            ete,été,
      records:
        lead: Quand vous terminez un entraînement, le résultat est enregistré automatiquement.
        complete:
          title: Écran de fin
          p1: Affiche le temps, la précision et le nombre de caractères erronés, la vitesse, le nombre de mots manqués et l’appareil. En dessous, les mots manqués sont listés avec le premier caractère erroné. « Réviser les mots manqués » reprend seulement ces mots, sans enregistrer cette révision.
          p2: La précision est la part de caractères corrects parmi ceux saisis. Les suppressions ne sont pas comptées, mais les caractères retapés après une correction le sont.
          p3: Quand vous battez votre record personnel, un badge et l’écart avec le record précédent s’affichent.
          p4: "« Encore » (<keys>Enter</keys>) relance aussitôt la même liste. Si l’enregistrement échoue, appuyez sur « Réessayer l’enregistrement »."
        history:
          title: Historique
          p1: 'L’<records>Historique</records> affiche vos entraînements par date, du plus récent au plus ancien, et peut être filtré par liste ou par appareil. Les filtres sont conservés dans l’URL : vous pouvez rouvrir le même affichage depuis un favori ou un lien.'
          p2: Avec un filtre par liste, le nombre d’entraînements et le meilleur résultat de cette liste s’affichent, et « S’entraîner » permet de commencer tout de suite. Choisir un pack limite les listes proposées à celles de ce pack. Les résultats d’un pack de deux listes ou plus s’affichent sous la forme « pack › liste ».
          p3: Le meilleur résultat de chaque liste porte la mention « Meilleur ». Si vous supprimez un meilleur résultat, la confirmation indique celui qui deviendra le meilleur.
        best:
          title: Meilleurs résultats
          p1: Choisissez une liste dans <rankings>Meilleurs résultats</rankings> pour voir votre record personnel, la moyenne de vos 5 derniers essais, l’évolution de votre temps et vos meilleurs résultats. L’écran des meilleurs résultats regroupe les listes par pack. Chaque pack indique le nombre d’entraînements, le nombre de listes déjà pratiquées (n/m entraînées), la date du dernier entraînement et le nombre de listes dont le meilleur résultat a été battu ces 7 derniers jours. Le tri s’applique aux packs ; les listes d’un pack restent classées par difficulté.
          p2: Le classement peut basculer entre « Précision d’abord » (précision la plus élevée, puis le plus rapide) et « Vitesse d’abord », et être filtré par appareil. La liste et les options choisies sont conservées dans l’URL.
          p3: L’écran d’entraînement affiche aussi les 5 meilleurs résultats de la liste choisie et met en évidence le dernier.
        wordCount:
          title: Si le nombre de mots change
          p1: Après l’ajout ou la suppression de mots dans une liste, seuls les résultats obtenus avec le nombre de mots actuel sont classés. Les meilleurs résultats de l’écran d’entraînement et de l’historique suivent la même règle.
          p2: Les résultats avec un nombre de mots différent peuvent être ajoutés au classement avec « Inclure » dans Meilleurs résultats. S’il n’existe encore aucun résultat avec le nombre de mots actuel, ce sont les résultats avec un nombre de mots différent qui sont classés.
        home:
          title: Accueil
          text: Dès que vous avez au moins un résultat, l’<home>Accueil</home> affiche le nombre d’entraînements de la semaine, votre série de jours consécutifs, la précision moyenne et le temps d’entraînement, la liste à travailler ensuite, ainsi que l’évolution des secondes par mot et de la précision pour chaque liste. Les jours suivent l’horloge de votre appareil, et les semaines commencent le lundi.
      devices:
        lead: 'Enregistrez dans <devices>Appareils</devices> les ordinateurs et claviers que vous utilisez pour vous entraîner : vos résultats indiqueront l’appareil utilisé.'
        p1: L’appareil choisi avec « Appareil » sur l’écran d’entraînement est mémorisé dans ce navigateur et réutilisé lors des entraînements suivants. Tant que vous n’en choisissez pas, « Par défaut » est utilisé.
        p2: Vous pouvez filtrer l’historique et les meilleurs résultats par appareil.
        p3: Si vous renommez un appareil, les résultats précédents gardent le nom qu’il avait au moment de l’entraînement. Vous pouvez enregistrer jusqu’à 100 appareils.
      storage:
        lead: La connexion est facultative. L’emplacement de vos données dépend de votre connexion.
        browser:
          title: Enregistré dans ce navigateur
          when: Quand vous n’êtes pas connecté
          p1: Toutes les fonctionnalités sont disponibles.
          p2: Les données sont enregistrées dans le LocalStorage de ce navigateur et ne sont pas synchronisées avec d’autres appareils ou navigateurs.
        account:
          title: Enregistré sur votre compte
          when: Quand vous êtes connecté (avec GitHub ou un identifiant et un mot de passe)
          p1: 'Les données sont enregistrées sur un serveur dédié à votre compte : une fois connecté, vous retrouvez les mêmes données sur tous vos appareils.'
          p2: L’enregistrement nécessite une connexion Internet.
        warning:
          title: Quand les données sont perdues
          p1: Les données enregistrées dans ce navigateur sont effacées si vous supprimez les données de site du navigateur. Vous pouvez sauvegarder vos listes importantes avec « Exporter en CSV ».
          p2: La suppression d’une liste supprime aussi son historique d’entraînement.
        notes:
          p1: Les deux emplacements conservent leurs données séparément, et rien n’est transféré automatiquement lors de la connexion.
          p2: Les données d’une version antérieure (v0.1.x) peuvent être ajoutées à l’emplacement actuel avec le bouton de migration de l’<home>Accueil</home>.
          p3: Si l’enregistrement échoue parce que des modifications ont été faites dans plusieurs fenêtres en même temps, chargez les données les plus récentes puis réessayez.
