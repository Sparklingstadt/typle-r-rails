      guide: Mode d’emploi
      features:
        title: Fonctionnalités
        create:
          title: Créer un pack
          description: Ajoutez les mots que vous voulez retenir. Le mot affiché et les caractères à taper se définissent séparément, et vous pouvez aussi importer des fichiers CSV.
        play:
          title: S’entraîner
          description: La vitesse, la précision et le nombre d’erreurs s’affichent en direct, ainsi que l’endroit où vous avez fait une faute.
        rankings:
          title: Meilleurs résultats
          description: Mesurez vos progrès avec votre record personnel, la moyenne de vos 5 derniers essais et l’évolution de votre temps.
      storage:
        title: Où sont enregistrées vos données
        text: La connexion est facultative. L’emplacement dépend de votre connexion, et les deux jeux de données sont conservés séparément (aucun transfert automatique).
        more: Pour en savoir plus, consultez <link>« Stockage et données » dans le mode d’emploi</link>.
