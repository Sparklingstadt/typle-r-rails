      licenses_text: Панель рукописного ввода использует следующее ПО и модели.
    guide:
      title: Как пользоваться
      step1: Тренируйтесь
      step2: Создавайте списки слов
      step3: Смотрите лучшие результаты
      toc: Содержание
      practice:
        heading: Тренировка
        body:
          - Выберите список в разделе «Тренироваться» и наберите показанное слово в поле ввода. Таймер запускается с первой клавиши и останавливается на последнем символе. Если уйти из поля ввода, тренировка встаёт на паузу.
          - В режиме «Вспомнить» слово скрыто, и вы набираете его только по примечанию. Если не получается, нажмите «Показать ответ» (Shift+Enter).
          - Списки с языком рукописного ввода можно тренировать в режиме «Handwriting». Переписывайте образец с помощью рукописного ввода ОС. Корейские списки можно писать и на панели рукописного ввода в приложении.
      lists:
        heading: Создание списков слов
        body:
          - Создайте набор кнопкой «Создать набор» и добавьте в него списки. По одному слову на строку; отображение, ввод и примечание разделяются табуляцией или запятой.
          - Официальный набор после подписки появляется среди ваших наборов. Его содержимое остаётся официальным и не редактируется.
      results:
        heading: Результаты и история
        body:
          - После тренировки на экране результатов показываются время, точность и слова с ошибками. Лучшие результаты сравниваются при текущем числе слов — сначала по точности, затем по времени.
          - На главной можно продолжить с того места, где остановились, и посмотреть трудные слова и итоги недели.
      devices:
        heading: Регистрация устройств
        body:
          - Зарегистрируйте клавиатуры в разделе «Устройства» и выберите нужную на экране тренировки — устройство сохранится в результатах.
      storage:
        heading: Хранение данных
        body:
          - Без входа данные сохраняются в этом браузере. После входа они сохраняются в аккаунте, а после выхода вы возвращаетесь к данным браузера. Эти данные никогда не копируются автоматически.
      keys:
        heading: Управление с клавиатуры
        body:
          - "Esc: начать заново / Shift+Enter: показать ответ (Вспомнить) / Enter: проверить (Handwriting) / ⌘Z или Ctrl+Z: отменить штрих (панель рукописного ввода)"
