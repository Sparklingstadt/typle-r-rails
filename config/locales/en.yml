      account_sync: Same data when signed in
      lost: Lost when
      browser_lost: You clear this browser's cookies
      account_lost: You delete your account
      now: "Currently stored in: %{storage}"
      tech: Technology
      licenses: Licences
      licenses_text: The handwriting pad uses the following software and models.
    guide:
      title: Guide
      step1: Practise
      step2: Create word lists
      step3: Check your best records
      toc: Contents
      practice:
        heading: Practise
        body:
          - Pick a list under "Practice" and type the word shown into the input field. The timer starts with your first key and stops at the last character. Leaving the input field pauses it.
          - In "Recall" the word is hidden and you type it from the note alone. If you're stuck, use "Show answer" (Shift+Enter).
          - Lists with a handwriting language can be practised in "Handwriting". Copy the sample using your OS's handwriting input. Korean lists can also be written on the app's handwriting pad.
      lists:
        heading: Create word lists
        body:
          - Create a pack with "New pack" and add lists to it. Put one word per line, separating display, input and note with tabs or commas.
          - Following an official pack adds it to your packs. Its contents stay official and can't be edited.
      results:
        heading: Check results and records
        body:
          - When you finish, the results screen shows your time, accuracy and missed words. Best records compare runs with the current word count, by accuracy first, then time.
          - On the home page you can pick up where you left off and check your weak words and weekly summary.
      devices:
        heading: Register devices
        body:
          - Register your keyboards under "Devices" and choose one on the practice screen to record which device you used.
      storage:
        heading: Storage and data
        body:
          - When you're not signed in, your data is saved in this browser. When you sign in, it is saved to your account; signing out switches back to the browser's data. The two are never copied automatically.
      keys:
        heading: Keyboard shortcuts
        body:
          - "Esc: restart / Shift+Enter: show answer (Recall) / Enter: check (Handwriting) / ⌘Z or Ctrl+Z: undo a stroke (handwriting pad)"
