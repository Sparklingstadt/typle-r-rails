    about:
      title: About Typle
      lead: Typle is a vocabulary book for learning commands and foreign words by typing. It is a rewrite of typle-r (built with Next.js) in Ruby on Rails %{version}.
      storage: Where your data is stored
      browser: This browser
      account: Account
      where: Stored in
      browser_where: Server data tied to this browser (identified by a cookie)
      account_where: Your account's data
      sync: Other devices
