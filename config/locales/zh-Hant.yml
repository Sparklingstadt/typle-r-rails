      feature_recall: 回想輸入與手寫
      feature_recall_text: 隱藏單字、只看註解來輸入，或照著範本手寫抄寫來記憶。
      feature_records: 紀錄
      feature_records_text: 在首頁查看每個清單的最佳紀錄、不熟的單字和本週摘要。
      storage: 未登入時，資料會儲存在此瀏覽器中。登入後資料會儲存到帳號（不會自動複製）。
      guide: 使用說明
      about: 關於 Typle
    about:
      title: 關於 Typle
      lead: Typle 是一款透過打字來記憶指令和外語單字的單字本。它是將以 Next.js 開發的 typle-r 用 Ruby on Rails %{version} 重寫的版本。
      storage: 資料儲存位置
      browser: 此瀏覽器
      account: 帳號
      where: 儲存位置
      browser_where: 與此瀏覽器綁定的伺服器資料（以 Cookie 識別）
      account_where: 帳號資料
      sync: 其他裝置
      browser_sync: 不同步
      account_sync: 登入後資料相同
      lost: 何時遺失
      browser_lost: 清除瀏覽器 Cookie 時
      account_lost: 刪除帳號時
      now: 目前儲存位置：%{storage}
      tech: 使用的技術
      licenses: 授權
      licenses_text: 手寫板使用了以下軟體和模型。
    guide:
      title: 使用說明
      step1: 練習
      step2: 建立單字清單
      step3: 查看最佳紀錄
      toc: 目錄
      practice:
        heading: 練習
        body:
          - 在「開始練習」中選擇清單，在輸入欄中輸入顯示的單字。按下第一個鍵開始計時，輸入最後一個字元時停止。離開輸入欄會暫停。
          - 「回想」模式會隱藏單字，只看註解來輸入。想不起來時可以用「查看答案」（Shift+Enter）顯示。
          - 設定了手寫語言的清單可以選擇「Handwriting」。看著範本，用作業系統的手寫輸入抄寫。韓文清單還可以在 App 的手寫板上書寫。
      lists:
        heading: 建立單字清單
        body:
          - 用「建立單字包」建立單字包，再加入清單。每行一個單字，用 Tab 或逗號分隔「顯示、輸入、註解」。
          - 追蹤官方單字包後，它會加入你的單字包。內容維持官方版本，無法編輯。
      results:
        heading: 查看結果和紀錄
        body:
          - 練習結束後，結果頁會顯示用時、正確率和打錯的單字。最佳紀錄只比較目前單字數下的紀錄，先比正確率，再比用時。
          - 在首頁可以接續上次的練習，查看不熟的單字和本週摘要。
      devices:
        heading: 登錄裝置
        body:
          - 在「裝置」中登錄所用鍵盤，並在練習畫面選擇，紀錄中就會保留裝置資訊。
      storage:
        heading: 儲存位置與資料
        body:
          - 未登入時，資料會儲存在此瀏覽器中。登入後儲存到帳號，登出後切回瀏覽器的資料。兩份資料不會自動複製。
      keys:
        heading: 鍵盤操作
        body:
          - Esc：從頭開始 / Shift+Enter：查看答案（回想）/ Enter：判定（Handwriting）/ ⌘Z・Ctrl+Z：復原一筆（手寫板）
