    about:
      title: À propos de Typle
      lead: Typle est un carnet de vocabulaire pour mémoriser des commandes et des mots étrangers en les tapant. C'est une réécriture en Ruby on Rails %{version} de typle-r, développé avec Next.js.
      storage: Où sont stockées vos données
      browser: Ce navigateur
      account: Compte
      where: Emplacement
      browser_where: Données sur le serveur liées à ce navigateur (identifié par un cookie)
      account_where: Données de votre compte
      sync: Autres appareils
      browser_sync: Non synchronisées
      account_sync: Mêmes données une fois connecté
      lost: Perdues si
      browser_lost: Vous effacez les cookies du navigateur
      account_lost: Vous supprimez votre compte
      now: "Emplacement actuel : %{storage}"
      tech: Technologies utilisées
      licenses: Licences
      licenses_text: Le pavé d'écriture manuscrite utilise les logiciels et modèles suivants.
    guide:
      title: Mode d'emploi
      step1: S'entraîner
      step2: Créer des listes de mots
      step3: Voir les meilleurs résultats
      toc: Sommaire
      practice:
        heading: S'entraîner
        body:
          - Choisissez une liste dans « S'entraîner » et tapez le mot affiché dans le champ de saisie. Le chronomètre démarre à la première touche et s'arrête au dernier caractère. Quitter le champ de saisie le met en pause.
          - En mode « Rappel », le mot est masqué et vous le tapez à partir de la note seule. En cas de blocage, utilisez « Voir la réponse » (Shift+Enter).
          - Les listes avec une langue d'écriture manuscrite peuvent être travaillées en « Handwriting ». Recopiez le modèle avec la saisie manuscrite de votre système. Les listes en coréen peuvent aussi être écrites sur le pavé manuscrit de l'application.
      lists:
        heading: Créer des listes de mots
        body:
          - Créez un pack avec « Créer un pack », puis ajoutez-y des listes. Un mot par ligne, en séparant affichage, saisie et note par des tabulations ou des virgules.
          - Suivre un pack officiel l'ajoute à vos packs. Son contenu reste officiel et ne peut pas être modifié.
      results:
        heading: Voir les résultats
        body:
          - À la fin, l'écran de résultats affiche le temps, la précision et les mots manqués. Les meilleurs résultats comparent les sessions au nombre de mots actuel, par précision puis par temps.
          - Sur l'accueil, vous pouvez reprendre là où vous vous étiez arrêté et consulter vos mots difficiles et le bilan de la semaine.
      devices:
        heading: Enregistrer des appareils
        body:
          - Enregistrez vos claviers dans « Appareils » et choisissez-en un sur l'écran d'entraînement pour que vos résultats indiquent l'appareil utilisé.
      storage:
        heading: Stockage et données
        body:
          - Sans connexion, vos données sont enregistrées dans ce navigateur. Une fois connecté, elles sont enregistrées dans votre compte ; en vous déconnectant, vous retrouvez les données du navigateur. Les deux ne sont jamais copiées automatiquement.
      keys:
        heading: Raccourcis clavier
        body:
          - "Esc : recommencer / Shift+Enter : voir la réponse (Rappel) / Enter : valider (Handwriting) / ⌘Z ou Ctrl+Z : annuler un trait (pavé manuscrit)"
